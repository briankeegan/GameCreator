<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Hypergolic Hull</title>
  <meta name="theme-color" content="#2f3b52" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Hypergolic Hull" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../shared/nav.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Header (All Games / title / chat) is injected by nav.js below. -->

  <main class="game-area" id="gameArea">
    <!-- The scan readout card: floats over the top of the field when a
         contact is inspected — Scan must never resize the board or add
         standing text of its own. -->
    <div class="enemy-info" id="enemyInfo" hidden></div>

    <div class="board-wrap" id="boardWrap">
      <div class="board-frame">
        <canvas id="board" width="320" height="320"></canvas>
        <div class="run-overlay" id="runOverlay" hidden>
          <h2 id="runOverlayTitle"></h2>
          <p id="runOverlayBody"></p>
          <p id="runOverlayRequisition"></p>
          <div class="loadout-picker" id="loadoutPicker"></div>
          <button id="continueBtn" hidden>Keep Flying</button>
          <button id="restartBtn">New Ship</button>
        </div>
        <div class="run-overlay outpost-overlay" id="outpostOverlay" hidden>
          <h2><i class="swatch swatch-outpost"></i> Sector Outpost</h2>
          <p>Salvage aboard: <span id="outpostSalvage">0</span></p>
          <!-- Buying is only half of what a dock is for — the Hold can only
               be rearranged while berthed. That used to go unsaid, so the
               refit half of the game hid behind a screen you had to already
               know about. The button IS the explanation; it sits above the
               shelf so it can't be missed, and needs no paragraph. -->
          <button id="outpostRefitBtn">Open the Hold</button>
          <div class="outpost-offers" id="outpostOffers"></div>
          <!-- Tapping the shelf INSPECTS. What it is, what shape it
               covers, what it costs — then a separate button spends the
               salvage. -->
          <div class="outpost-detail" id="outpostDetail" hidden></div>
          <button id="outpostCloseBtn">Undock</button>
          <p class="outpost-note">Tap the dock to come back.</p>
        </div>
      </div>
    </div>

    <!-- The control panel: everything about the ship in ONE framed console
         ("bring all the information together nicely as what looks like a
         control panel") — gauges, this turn's actions, the Scan/Hardpoints
         modes, and the readout strip. Every gauge/button is dynamic:
         gauges flash on change, actions appear the moment they unlock. -->
    <div class="console control-panel">
      <div class="panel-gauges">
        <span class="stat-wrap" id="apWrap">
          <span class="stat-label">Actions</span>
          <span class="stat-bar" id="apBar"></span>
        </span>
        <span class="stat-wrap" id="shieldWrap" hidden>
          <span class="stat-label">Shields</span>
          <span class="stat-bar" id="shieldBar"></span>
        </span>
        <span class="stat-wrap" id="hullWrap">
          <span class="stat-label">Hull</span>
          <span class="stat-bar" id="hullBar"></span>
        </span>
        <span class="stat-wrap" id="energyWrap">
          <span class="stat-label">Energy</span>
          <span class="stat-bar" id="energyBar"></span>
        </span>
        <span class="stat-wrap" id="salvageWrap">
          <span class="stat-label">Salvage</span>
          <span class="stat-value" id="salvageValue">0</span>
        </span>
      </div>
      <!-- The fitted-equipment row: every button IS a piece of installed
           hardware, named for what's actually slotted ("rather than calling
           them fire/recharge, name the weapon or the item"). Tapping one
           that can't act right now explains itself and shows its reach. -->
      <div class="console-grid actions-grid">
        <button id="enginesBtn" title="Sublight drive — mark a heading on the field, then confirm it">Engines</button>
        <!-- One button per fitted weapon, built at render time (see
             updateSystems) — firing "everything at once" was never a
             decision. -->
        <span id="weaponBtns" class="weapon-btns"></span>
        <button id="rechargeBtn" title="Reactor core — cycle it and put charge back on the bus">Reactor Core</button>
        <button id="shieldsBtn" hidden title="Shield generator — burn charge to raise a screen; it eats one volley">Shield Generator</button>
      </div>
      <div class="console-grid modes-grid">
        <button id="scanBtn" class="scan-btn" title="Scanner array — read anything on the board; the helm holds while it is open" aria-label="Scan">Scan</button>
        <button id="shipBtn" class="scan-btn" title="Systems — this ship, and everything bolted into it" aria-label="Systems">Systems</button>
        <button id="mapBtn" class="scan-btn" title="Chart — where we have been, and the gates out" aria-label="Map">Map</button>
      </div>
      <p id="log" class="log"></p>
    </div>

  </main>

  <div class="ship-overlay" id="shipOverlay" hidden>
    <div class="ship-overlay-inner">
      <h2>Systems</h2>
      <!-- The portrait sits in a frame so the scuttling charges have
           somewhere to go off: blowing them takes the ship apart right
           here, on the screen you armed them from. -->
      <div class="portrait-frame">
        <img class="ship-portrait" id="shipPortrait" src="icons/flagship.png" alt="Your flagship" />
        <!-- A scanned contact's own hull, drawn with the same renderer the
             board uses (see renderPortrait) instead of a stand-in image. -->
        <canvas class="ship-portrait" id="contactPortrait" width="192" height="192" hidden></canvas>
        <canvas class="scuttle-fx" id="scuttleFx" width="192" height="192" hidden></canvas>
      </div>
      <div class="ship-section" id="shipStats"></div>
      <div class="ship-section" id="shipHardpoints"></div>
      <button id="shipCloseBtn">Return to Helm</button>
    </div>
  </div>

  <!-- The starmap — only what you actually know: sectors charted this run,
       where you are, and the gates ahead as uncharted contacts. -->
  <div class="ship-overlay" id="mapOverlay" hidden>
    <div class="ship-overlay-inner map-inner">
      <h2>Map</h2>
      <div class="ship-section" id="mapChart"></div>
      <button id="mapCloseBtn">Return to Helm</button>
    </div>
  </div>

  <div class="install-banner" id="installBanner">
    <img class="install-banner-icon" src="icons/icon.svg" alt="" />
    <div class="install-banner-text" id="installBannerText">
      Install this game: tap <span class="share-glyph" aria-label="Share">&#x2B06;&#xFE0E;</span>
      then <strong>Add to Home Screen</strong>
    </div>
    <button class="install-banner-btn" id="installBannerBtn" hidden>Install</button>
    <button class="install-banner-close" id="installBannerClose" aria-label="Dismiss">&times;</button>
  </div>

  <script src="../../shared/nav.js"
          data-game-id="hypergolic-hull"
          data-game-name="Hypergolic Hull"
          data-version="v1"
          data-root="../../"></script>
  <script src="../../shared/storage.js"></script>
  <script src="levels.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
  <script src="../../shared/pwa.js" data-sw="sw.js"></script>
</body>
</html>
