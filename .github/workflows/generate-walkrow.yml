name: Generate walk row

# ONE dispatch that produces a verified walk row for a sheet-based game.
#
# It exists because the alternative — hand-assembling a 3000-character prompt
# per row, generating, and eyeballing the result — is how a dozen bad rows got
# generated for Dog Punk. The recipe that works is written down in
# .github/art/CHARACTER_SHEETS.md; this Action is that recipe, executable:
#
#   1. builds the prompt from .github/art/walkgrid_prompt.txt (the single copy
#      — edit it there, not here) plus the game's art-style.json, so the
#      character description and locked details cannot be retyped differently;
#   2. generates ONE ROW on a landscape canvas, never a 3x3 grid;
#   3. VERIFIES it with verify_sheet.py before anything is committed —
#      clipping, frame count, duplicate frames, missing neutral, and (on front
#      and back rows) the same-foot-twice repeat;
#   4. commits the raw only if it passes.
#
# A failed row costs the generation and nothing else: it is not committed, so
# it cannot quietly end up in a sheet. Cutting the row into a sheet is still a
# deliberate build_sheet.py step, because which rows make up which sheet is a
# decision, not something to guess.
on:
  workflow_dispatch:
    inputs:
      game:
        description: "Game id, e.g. dog-punk (reads games/<id>/art-style.json)"
        required: true
        type: string
      character:
        description: "Character id, used for the filename: art-src/<character>_<view>_raw.png"
        required: true
        type: string
      view:
        description: "Which row"
        required: true
        type: choice
        options:
          - front
          - side
          - back
      description:
        description: "The character, in words. Leave blank to use the game's art-style.json mainCharacter."
        required: false
        type: string
      quality:
        description: "Render quality — medium is enough for flat cartoon pixel art; high costs ~4x."
        required: false
        type: choice
        options:
          - "low"
          - "medium"
          - "high"
        default: "medium"
      force:
        description: "Regenerate (and re-bill) even if the output already exists."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the prompt
        id: prompt
        timeout-minutes: 3
        env:
          GAME: ${{ inputs.game }}
          VIEW: ${{ inputs.view }}
          DESCRIPTION: ${{ inputs.description }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib, re
          game, view = os.environ['GAME'], os.environ['VIEW']
          style_path = pathlib.Path(f'games/{game}/art-style.json')
          if not style_path.is_file():
              raise SystemExit(f'::error::{style_path} does not exist — create it before generating art.')
          style = json.loads(style_path.read_text())
          char = os.environ.get('DESCRIPTION') or style.get('mainCharacter')
          if not char:
              raise SystemExit('::error::No character description given and art-style.json has no mainCharacter.')
          locked = style.get('lockedDetails')
          if locked:
              char = f'{char} LOCKED DETAILS, identical in every frame: {locked}'

          text = pathlib.Path('.github/art/walkgrid_prompt.txt').read_text()
          body = text.split('---8<--- PROMPT STARTS ---8<---')[1].split('---8<--- PROMPT ENDS ---8<---')[0]
          blocks = dict(re.findall(r'\{VIEW\} = (FRONT|SIDE|BACK) ROW\n-+\n(.*?)(?=\n\n\n|\Z)', text, re.S))
          prompt = body.replace('{CHARACTER}', char).replace('{VIEW}', blocks[view.upper()].strip())
          prompt = ' '.join(prompt.split())
          print('prompt<<PROMPT_EOF'); print(prompt); print('PROMPT_EOF')
          PY

      - name: Generate via OpenAI
        id: gen
        timeout-minutes: 15
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROMPT: ${{ steps.prompt.outputs.prompt }}
          OUT: games/${{ inputs.game }}/art-src/${{ inputs.character }}_${{ inputs.view }}_raw.png
          QUALITY: ${{ inputs.quality }}
          FORCE: ${{ inputs.force }}
        run: |
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          if [ -s "$OUT" ] && [ "$FORCE" != "true" ]; then
            echo "::notice::$OUT already exists — skipping (re-run with force=true)."
            echo "skipped=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          mkdir -p "$(dirname "$OUT")"
          # Landscape canvas, always: a 3x3 grid on a square canvas clips its
          # bottom row and on a tall canvas drops a column. One row per image.
          ok=""
          for attempt in 1 2 3 4 5 6; do
            resp=$(curl -sS -w '\n%{http_code}' https://api.openai.com/v1/images/generations \
              -H "Authorization: Bearer $OPENAI_API_KEY" -H "Content-Type: application/json" \
              -d "$(jq -n --arg p "$PROMPT" --arg q "$QUALITY" \
                    '{model:"gpt-image-1", prompt:$p, size:"1536x1024", quality:$q, n:1}')" || true)
            code=$(printf '%s' "$resp" | tail -n1); body=$(printf '%s' "$resp" | sed '$d')
            [ "$code" = "200" ] && { ok=1; break; }
            err=$(printf '%s' "$body" | jq -r '.error.message // empty' 2>/dev/null)
            if [ "$code" = "429" ] || [ "$code" = "000" ] || [ "${code#5}" != "$code" ]; then
              wait=$((attempt * 15 + RANDOM % 8))
              echo "Rate-limited/transient (HTTP $code, attempt $attempt): ${err:-no body} — retrying in ${wait}s"
              sleep "$wait"; continue
            fi
            echo "::error::OpenAI API error (HTTP $code): ${err:-unknown}"; exit 1
          done
          [ -n "$ok" ] || { echo "::error::Still rate-limited after retries — try again later."; exit 1; }
          printf '%s' "$body" | jq -r '.data[0].b64_json' | base64 -d > "$OUT"
          [ -s "$OUT" ] || { echo "::error::Output file is empty — generation failed"; exit 1; }

      # The gate. A row that fails here is NOT committed — the whole point is
      # that a bad row cannot reach a sheet just because nobody looked at it.
      - name: Verify the row
        if: steps.gen.outputs.skipped != 'true'
        timeout-minutes: 5
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow numpy
          extra=""
          # --mirrored only applies to the camera-on views; mirroring a side
          # profile turns it into the other direction, so the test is
          # meaningless there (see MIRROR_STEP_MAX in verify_sheet.py).
          [ "${{ inputs.view }}" != "side" ] && extra="--mirrored"
          python3 .github/art/verify_sheet.py raw "${{ steps.gen.outputs.out }}" \
                  --frames 3 --walk $extra || {
            echo "::error::The generated row did not pass verification and was NOT committed. \
          Read the messages above, fix the prompt or the standard, and run again with force=true."
            exit 1
          }

      - name: Commit the raw
        if: steps.gen.outputs.skipped != 'true'
        timeout-minutes: 5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.gen.outputs.out }}"
          if git commit -m "Generate walk row: ${{ inputs.game }} ${{ inputs.character }} ${{ inputs.view }}"; then
            for i in 1 2 3 4 5 6; do
              if git pull --rebase origin main && git push; then exit 0; fi
              echo "push race, retrying ($i)…"; sleep $((RANDOM % 6 + 2))
            done
            echo "::error::Could not push after retries"; exit 1
          fi

      - name: Next step
        if: steps.gen.outputs.skipped != 'true'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          Row generated and verified: `${{ steps.gen.outputs.out }}`

          It is a RAW, not shipped art. Cut it into the sheet when all three
          rows exist:

          ```
          python3 .github/art/build_sheet.py \
            --style games/${{ inputs.game }}/art-style.json \
            --out games/${{ inputs.game }}/${{ inputs.character }}_sheet.png \
            --row games/${{ inputs.game }}/art-src/${{ inputs.character }}_front_raw.png \
            --row games/${{ inputs.game }}/art-src/${{ inputs.character }}_side_raw.png \
            --row games/${{ inputs.game }}/art-src/${{ inputs.character }}_back_raw.png \
            --build-steps 0,2
          ```

          `--build-steps 0,2` builds both step frames of the front and back
          rows from their standing frame, so those two rows only need a good
          MIDDLE frame. Then bump the game's `sw.js` cache name.
          MD
