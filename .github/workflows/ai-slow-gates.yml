# THE GATES TOO SLOW TO FINISH BETWEEN PUSHES.
#
# SLOW_GATES in gates.sh — each measured over SLOW_SECONDS; the longest play
# whole duels and take over an hour. A push-triggered workflow that cancels in
# progress never lets a job that long reach a conclusion, and `cancelled` turns
# nothing red. On a schedule the run is never racing a newer commit, so it
# concludes; a break is caught within a day rather than on the push that caused
# it.
name: AI slow gates

on:
  schedule:
    # 04:17 UTC. Off the hour because scheduled runs bunch up there and get
    # delayed; the minute is arbitrary and only has to be its own.
    - cron: '17 4 * * *'
  workflow_dispatch:

# NOT cancel-in-progress. Two nightly runs never overlap, and a dispatched run
# asking for an answer must not be killed by the next schedule.
concurrency:
  group: ai-slow-gates
  cancel-in-progress: false

jobs:
  slow-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      # The real attack files and puzzles, which the slow gates and
      # PANEL_GAME_GATES read; without them they fail on setup, not on the code.
      - uses: actions/checkout@v4
        with:
          repository: briankeegan/panel-game
          path: panel-game
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Slow gates
        env:
          GC_TRAINING_DIR: ${{ github.workspace }}/panel-game/client/assets/default_data/training
          GC_PANEL_GAME: ${{ github.workspace }}/panel-game
        run: source .github/scripts/gates.sh && gate_slow
      # the drill's deal comes from the live server's Lua (gate_clock): the
      # branch with bot/headlessBoot.lua, as ai-survival-scan.yml checks out
      - uses: actions/checkout@v4
        if: success() || failure()
        timeout-minutes: 5
        with:
          repository: briankeegan/panel-game
          ref: bramp/multi-player
          path: panel-game-live
          fetch-depth: 1
      - name: Lua and clang for the drill
        if: success() || failure()
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq luajit luarocks liblua5.1-0-dev clang
          for r in luafilesystem luasocket luautf8; do luarocks --lua-version 5.1 --local install $r; done
      - name: Gates that need panel-game
        if: success() || failure()
        env:
          GC_TRAINING_DIR: ${{ github.workspace }}/panel-game/client/assets/default_data/training
          GC_PANEL_GAME: ${{ github.workspace }}/panel-game
          GC_PANEL_GAME_LIVE: ${{ github.workspace }}/panel-game-live
        run: source .github/scripts/gates.sh && gate_panel_game
