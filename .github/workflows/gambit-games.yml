# Gambit's games, repeatable: every seed of each training mode played at level 10 on the server's own Lua engine
# (games/the-game/ai/eval/lua/gambitTrain.lua), Gambit through the survivor link with every answer waited for and its searches on a
# fixed clock (GC_FIXED_CLOCK), so the same build plays the same games every time -- the way to compare two builds. Each decision's real
# time is logged beside it (GAMBITD wallMs): the real-client runs (training-mode.yml) stay the check that it plays in time.
name: Gambit games

on:
  workflow_dispatch:
    inputs:
      profile:
        description: the Gambit profile, relative to games/the-game/ai/eval
        default: survivor-profiles/gambit-finish.json
      modes:
        description: the training modes, as a JSON list
        default: '["combo_storm","factory","large_garbage"]'
      seeds:
        description: the seeds each mode plays, as a JSON list
        default: '[1,2,3,4,5,6,7,8]'
      frames:
        description: frames each game plays (21600 is six minutes)
        default: '21600'
      clock:
        description: "GC_FIXED_CLOCK: the mind's milliseconds per clock read"
        default: '1.4'
      panel_game_ref:
        description: the panel-game commit the games run on (bramp/multi-player); change it on purpose, never by drift
        default: 3e46f42dce861916ba0955842746d2ad6decc578

concurrency:
  group: gambit-games-${{ github.sha }}-${{ inputs.profile }}-${{ inputs.modes }}-${{ inputs.seeds }}-${{ inputs.frames }}-${{ inputs.clock }}
  cancel-in-progress: true

jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        mode: ${{ fromJSON(inputs.modes) }}
        seed: ${{ fromJSON(inputs.seeds) }}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          sparse-checkout: |
            games/the-game/ai/eval
            games/the-game/pa-engine.js
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          repository: briankeegan/panel-game
          ref: ${{ inputs.panel_game_ref }}
          path: panel-game
          fetch-depth: 1
      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: '22'
      - name: The runner image
        id: image
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: The rocks, as the last run built them
        uses: actions/cache@v4
        timeout-minutes: 5
        with:
          path: ~/.luarocks
          key: luarocks-${{ steps.image.outputs.version }}-luafilesystem-luasocket-luautf8
      - name: LuaJIT and the panel-game rocks
        timeout-minutes: 20
        run: |
          try() { for n in 1 2 3; do timeout 180 "$@" && return 0; sleep 15; done; return 1; }
          sudo apt-get install -y -qq luajit luarocks liblua5.1-0-dev || { try sudo apt-get update -qq; try sudo apt-get install -y -qq luajit luarocks liblua5.1-0-dev; }
          for r in luafilesystem luasocket luautf8; do try luarocks --lua-version 5.1 --local install $r; done
      - name: ${{ matrix.mode }} seed ${{ matrix.seed }}
        timeout-minutes: 75
        env:
          GC_FIXED_CLOCK: ${{ inputs.clock }}
          GC_SURVIVOR_SYNC: '1'
          PA_SURVIVOR_PORT: '47791'
        run: |
          EVAL=$GITHUB_WORKSPACE/games/the-game/ai/eval
          GC_SURVIVOR_PROFILE=$EVAL/${{ inputs.profile }} node $EVAL/survivor.js --port 47791 > survivor.log 2>&1 &
          SRV=$!
          for n in $(seq 1 30); do grep -q listening survivor.log && break; sleep 1; done
          eval "$(luarocks --lua-version 5.1 path)"
          cd panel-game
          export LUA_PATH="./?.lua;./common/lib/?.lua;$LUA_PATH;;" LUA_CPATH="./common/lib/?.so;./common/lib/?/?.so;$LUA_CPATH;;"
          luajit $EVAL/lua/gambitTrain.lua ${{ matrix.mode }} ${{ matrix.seed }} ${{ inputs.frames }} | tee ../result.txt
          cd ..
          for n in $(seq 1 30); do grep -q 'match over' survivor.log && break; sleep 1; done
          kill $SRV || true
          grep -h '^RESULT' result.txt | sed 's/^/::notice title=gambit::/'
          grep -h 'match over' survivor.log | head -1 | sed 's/^/::notice title=stats::/'
      - name: Keep the game
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: game-${{ matrix.mode }}-${{ matrix.seed }}
          path: |
            survivor.log
            result.txt
          retention-days: 14
