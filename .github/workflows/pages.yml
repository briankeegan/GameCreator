name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Every push to main deployed straight to production with no
      # automated check at all — several hot-fix commits this session
      # shipped on trust that `node .../engine.test.js` had been run by
      # hand first. These are each game's headless rules-engine suite:
      # deterministic, no browser, seconds to run. browser.test.js is
      # deliberately NOT run here — it needs Playwright/Chromium and has
      # shown real timing flakiness in this environment, which would risk
      # blocking every game's deploy over one game's unrelated animation
      # timing, worse than the gap it would close.
      - name: Run headless engine tests
        run: |
          status=0
          for f in games/*/engine.test.js; do
            echo "== $f =="
            node "$f" || status=1
          done
          exit $status
      # THE DOOR GATE — docs/DOOR_STANDARD.md. A door is one half of a pair,
      # arrival is derived from the partner rather than typed, and a doorway
      # has to be drawn in the wall its trigger is armed in. Every one of
      # those was learned by shipping the opposite: three rooms putting the
      # player down on the same square of lounge floor nowhere near the door
      # she walked through, and a spawn point parked on a doorway so the door
      # never armed at all. The checker finds every game itself — a game is
      # covered as soon as it publishes its door data (§8), with no list here
      # to forget to update.
      - name: Verify room exits
        run: node .github/scripts/check_room_exits.mjs

      # A game whose own JS calls GCControls.create()/GCSaveSlots.create()/
      # GCTitleScreen.create() but is missing the matching <script> tag or
      # precache entry ships a ReferenceError or goes stale offline — see
      # sync-precache.js's header. This script existed for two commits
      # tonight before anything actually ran it on push; it would have
      # caught nothing until someone remembered to run it by hand, which is
      # exactly the failure mode "rule -> tool -> gate" exists to close.
      # Fails on real wiring gaps; only warns (never blocks) on the
      # title-screen onShow check, since a text-only game legitimately has
      # nothing to draw.
      - name: Verify shared-module wiring
        run: node .github/autopilot/sync-precache.js

      # A DOOR HAS TO BE ENTERED, NOT GRAZED — and that is a number, so it is
      # gated. The Arena's way out was armed above the walkable platform and
      # could be reached by exactly ONE pixel of the player's box: the link was
      # paired, the destination real, the arrival derivable, and the browser
      # door test walked it green, because that test teleports the player next
      # to a trigger and steps in. It proves a door FIRES, never that anyone
      # can reach it. Holding one direction out of the spawn went straight past
      # it into the wall.
      #
      # remap_doors.py measures how deeply a player can get onto each trigger,
      # off the room's own art. Every working door in Newsey measures 13-14px;
      # that Arena rectangle measured 1. --check fails on the unambiguous half
      # only: a door nobody can enter is a fact, while the tool's PROPOSALS to
      # move a trigger are advice (it cannot see prop collision) and a fuzzy
      # check must never block a deploy.
      - name: Verify doors can be entered
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow numpy
          status=0
          for d in games/*/story.js; do
            g=$(dirname "$d")
            [ -d "$g/art" ] || continue
            echo "== $g =="
            python3 .github/art/remap_doors.py "$g" --check || status=1
          done
          exit $status

      # Rooms built to the three-pass standard (docs/ROOM_ART_STANDARD.md):
      # the background is ONLY the walkable surface and everything else is a
      # prop, so the collision mask is the plate's own silhouette. Every check
      # in `room.py verify` is a bug that actually shipped — a plate that
      # didn't fill the frame (which is the ROOM being smaller than its frame,
      # since the plate is the walkable area), a playerStart sitting inside its
      # own exit trigger so the door never armed, a prop footprint covering a
      # doorway, art that doesn't exist, flat ground cover carrying a
      # footprint, and dead floorPoly/obstacles contradicting the mask. Rule ->
      # tool -> gate, same as the room exits and the sprite sheets above.
      - name: Verify room props and floor plates
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow numpy
          status=0
          for d in games/*/; do
            [ -f "$d/story.js" ] || continue
            echo "== $d =="
            python3 .github/art/room.py verify "${d%/}" || status=1
          done
          exit $status

      # The art index (.github/art/README.md) is the one page that says what
      # exists and which tool to reach for. It is only useful if it is true,
      # so it is checked both ways: a tool or prompt that isn't listed fails
      # here, and so does a path listed there that doesn't exist. Rule ->
      # tool -> gate, applied to the index itself — because the failure it
      # prevents already happened at a larger scale, when the autopilot's
      # private COPY of the art rules drifted months behind the standard.
      - name: Verify the art index
        run: node .github/scripts/check_art_registry.mjs

      # Every art id a game NAMES must have a file behind it. The game is
      # deliberately forgiving at runtime — a missing portrait draws the
      # character's initial in a coloured circle instead — which means a
      # missing file never fails anything and ships unnoticed. That is how a
      # K ended up standing in Kyran's lab. Forgiving runtime, strict build.
      - name: Verify art references
        run: node .github/scripts/check_art_refs.mjs

      # Shipped sprite sheets: no empty cells (the cutter silently produced
      # nothing for one), no colour outside the game's lockedPalette (art
      # that bypassed the cutter), and — as a warning — a front or back row
      # whose two step frames lift the same foot, which makes a character walk
      # with one leg. All three have happened. Rule lives in
      # .github/art/CHARACTER_SHEETS.md, enforcement in verify_sheet.py, and
      # this step is what stops either being ignored. Geometry is inferred
      # from the 256px cell size, so a new sheet is covered automatically.
      - name: Verify shipped sprite sheets
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow numpy
          status=0
          for sheet in games/*/*_sheet.png; do
            [ -e "$sheet" ] || continue
            game=$(dirname "$sheet")
            style="$game/art-style.json"
            echo "== $sheet =="
            if [ -f "$style" ]; then
              python3 .github/art/verify_sheet.py sheet "$sheet" --style "$style" || status=1
            else
              python3 .github/art/verify_sheet.py sheet "$sheet" || status=1
            fi
          done
          # ART DOES NOT BLOCK THE SITE. See "Report art problems" below.
          [ "$status" = 0 ] || echo "Verify shipped sprite sheets" >> $RUNNER_TEMP/art-problems
          exit 0

      # The short rules cards a Clubhouse run reads are EXTRACTED from the
      # standards, never written alongside them — two copies of one truth is
      # this repo's signature failure. This fails the build if a card no longer
      # matches its standard, because a run obeying rules nobody agreed to any
      # more is worse than a run reading the long version.
      - name: Verify rules cards match their standards
        run: |
          status=0
          for std in .github/art/CHARACTER_SHEETS.md docs/ROOM_ART_STANDARD.md docs/TILED_LEVEL_STANDARD.md docs/DOOR_STANDARD.md; do
            python3 .github/art/rules_card.py --check "$std" || status=1
          done
          # ART DOES NOT BLOCK THE SITE — this is a stale-DOCUMENTATION check,
          # not broken game art, and it just proved the point live: another
          # session's edit to ROOM_ART_STANDARD.md left its card stale, and
          # this step would have blocked Dog Punk's completely unrelated
          # deploy over a markdown-derived cache file nobody looks at while
          # playing. Same bucket as the other art checks below.
          [ "$status" = 0 ] || echo "rules cards out of date" >> $RUNNER_TEMP/art-problems
          exit 0

      # CHARACTER SPECS. The checks above look at one sheet at a time, and the
      # thing that shipped next was invisible to all of them: Beverly's mohawk
      # is 2.2% of her walking front row and 0.1% of her ATTACKING front row —
      # it stops being drawn when she swings. Each sheet passed alone. Nothing
      # compared them, so nothing could see it.
      - name: Verify character consistency across sheets
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow numpy
          status=0
          for style in games/*/art-style.json; do
            [ -e "$style" ] || continue
            game=$(dirname "$style")
            chars=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(' '.join((d.get('characters') or {}).keys()))" "$style")
            for char in $chars; do
              echo "== $char ($game) =="
              python3 .github/art/verify_sheet.py character "$game" "$char" || status=1
            done
          done
          # ART DOES NOT BLOCK THE SITE. See "Report art problems" below.
          [ "$status" = 0 ] || echo "character consistency" >> $RUNNER_TEMP/art-problems
          exit 0

      # Tiled levels: the third shape of art, and the one that had a pipeline
      # and no checker until four separate defects shipped to a player in a
      # single pass. Detected, not configured: a game with a tiles.png has a
      # tile strip. Rule in docs/TILED_LEVEL_STANDARD.md, decided by
      # verify_tiles.py, tripped here.
      - name: Verify tile strips
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow numpy
          status=0
          for strip in games/*/tiles.png; do
            [ -e "$strip" ] || continue
            game=$(dirname "$strip")
            echo "== $strip =="
            python3 .github/art/tileset.py verify "$game" || status=1
          done
          # ART DOES NOT BLOCK THE SITE. See "Report art problems" below.
          [ "$status" = 0 ] || echo "Verify tile strips" >> $RUNNER_TEMP/art-problems
          exit 0

      # The same walk-cycle rules for games that ship INDIVIDUAL frame files
      # instead of sheets (Newsey). Which checks apply depends on how a game
      # ships its art, so the shape is detected rather than configured: any
      # <id>_down_1.png in a game's art/ directory is a character with a frame
      # set. Missing/duplicate frames fail; "no neutral" warns, because that
      # one is a fuzzy metric and a borderline-but-correct set must not block
      # a deploy.
      - name: Verify character frame sets
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow numpy
          status=0
          broken=""
          for f in games/*/art/*_down_1.png; do
            [ -e "$f" ] || continue
            dir=$(dirname "$f")
            char=$(basename "$f" _down_1.png)
            echo "== $char ($dir) =="
            if ! python3 .github/art/verify_sheet.py frames "$dir" "$char"; then
              status=1
              broken="$broken $(printf '%s' "$dir" | cut -d/ -f2)/$char"
            fi
          done
          # NAME THE CULPRIT. This build is one artifact for every game, so a
          # single character's frames failing blocks the whole site — which is
          # correct (half a site cannot be deployed) but was invisible: one
          # game's art failed five deploys in a row while a DIFFERENT game's
          # thread said its change was live. Whoever reads this needs to know
          # in one line whose art is holding the site, not have to scroll a log.
          # ART DOES NOT BLOCK THE SITE. See "Report art problems" below.
          [ -z "$broken" ] || echo "character frames:$broken" >> $RUNNER_TEMP/art-problems
          exit 0

      # THE SITE ALWAYS SHIPS.
      #
      # The art checks above used to fail this build. That is defensible in the
      # abstract and was wrong in practice: this build is ONE artifact for every
      # game, so one character's frames failing took the whole site down with
      # it. It happened — `may: CROPPED` in the-game failed five deploys in a
      # row, and Dog Punk's colour fix, already on main and already correct, sat
      # undeployed while its thread said it was live. A game with no art problem
      # at all could not ship because a different game had one.
      #
      # So the art checks REPORT and the deploy proceeds. Two things keep that
      # from becoming "nobody fixes art":
      #   * the autopilot still runs the same checkers BEFORE it lands, so a run
      #     cannot introduce broken art in the first place — that is the gate
      #     that actually catches things, because it catches them at the moment
      #     they are made;
      #   * a problem here is annotated, summarised, and handed to the thread
      #     that owns the game (see "Tell the thread" below), so it becomes
      #     someone's next job instead of a silent block.
      - name: Report art problems
        if: always()
        run: |
          [ -s $RUNNER_TEMP/art-problems ] || { echo "No art problems."; exit 0; }
          echo "::warning::Art problems found (the site still deployed): $(paste -sd'; ' $RUNNER_TEMP/art-problems)"
          { echo "### Art problems"; echo;
            echo "The site deployed anyway — these do not block it."; echo;
            sed 's/^/- /' $RUNNER_TEMP/art-problems; } >> "$GITHUB_STEP_SUMMARY"

      # Same mechanism HayleysGame's clubhouse already uses in production —
      # after chasing several more elaborate "fixes" here that each added a
      # new bug of their own, reverted back to exactly this.
      - name: Stamp version
        run: echo "window.APP_VERSION = \"v0.${GITHUB_RUN_NUMBER}\";" > version.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Archiving manually (same tar command actions/upload-pages-artifact
      # uses internally) instead of that composite action, because it
      # doesn't expose overwrite control. Without overwrite:true, re-running
      # this workflow after a first attempt already uploaded an artifact
      # leaves two artifacts named "github-pages" behind, and deploy-pages
      # then fails with "Multiple artifacts ... unexpectedly found" — this
      # makes a rerun safe by replacing the old artifact instead.
      - name: Archive site
        run: |
          tar \
            --dereference --hard-dereference \
            --directory "." \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          overwrite: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
