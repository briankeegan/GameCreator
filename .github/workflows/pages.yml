name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Every push to main deployed straight to production with no
      # automated check at all — several hot-fix commits this session
      # shipped on trust that `node .../engine.test.js` had been run by
      # hand first. These are each game's headless rules-engine suite:
      # deterministic, no browser, seconds to run. browser.test.js is
      # deliberately NOT run here — it needs Playwright/Chromium and has
      # shown real timing flakiness in this environment, which would risk
      # blocking every game's deploy over one game's unrelated animation
      # timing, worse than the gap it would close.
      - name: Run headless engine tests
        run: |
          status=0
          for f in games/*/engine.test.js; do
            echo "== $f =="
            node "$f" || status=1
          done
          exit $status
      # Every door needs arriveFacing + a landing spot that's real floor and
      # clear of every OTHER exit in that room — two room pairs shipped
      # without that (arriveFacing missing entirely, and separately two door
      # pairs landing close enough to an unrelated door to "bounce" a player
      # right back out on one accidental keypress) before this existed. See
      # the EXIT / DOOR CONVENTION comment in each game's story.js.
      - name: Verify room exits
        run: |
          status=0
          for f in games/*/story.js; do
            echo "== $f =="
            node .github/scripts/check_room_exits.mjs "$f" || status=1
          done
          exit $status

      # Rooms built to the three-pass standard (docs/ROOM_ART_STANDARD.md):
      # the background is ONLY the walkable surface and everything else is a
      # prop, so the collision mask is the plate's own silhouette. Every check
      # in `room.py verify` is a bug that actually shipped — a plate that
      # didn't fill the frame (which is the ROOM being smaller than its frame,
      # since the plate is the walkable area), a playerStart sitting inside its
      # own exit trigger so the door never armed, a prop footprint covering a
      # doorway, art that doesn't exist, flat ground cover carrying a
      # footprint, and dead floorPoly/obstacles contradicting the mask. Rule ->
      # tool -> gate, same as the room exits and the sprite sheets above.
      - name: Verify room props and floor plates
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow numpy
          status=0
          for d in games/*/; do
            [ -f "$d/story.js" ] || continue
            echo "== $d =="
            python3 .github/art/room.py verify "${d%/}" || status=1
          done
          exit $status

      # Shipped sprite sheets: no empty cells (the cutter silently produced
      # nothing for one) and no colour outside the game's lockedPalette (art
      # that bypassed the cutter). Both have happened. Rule lives in
      # .github/art/CHARACTER_SHEETS.md, enforcement in verify_sheet.py, and
      # this step is what stops either being ignored. Geometry is inferred
      # from the 256px cell size, so a new sheet is covered automatically.
      - name: Verify shipped sprite sheets
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow numpy
          status=0
          for sheet in games/*/*_sheet.png; do
            [ -e "$sheet" ] || continue
            game=$(dirname "$sheet")
            style="$game/art-style.json"
            echo "== $sheet =="
            if [ -f "$style" ]; then
              python3 .github/art/verify_sheet.py sheet "$sheet" --style "$style" || status=1
            else
              python3 .github/art/verify_sheet.py sheet "$sheet" || status=1
            fi
          done
          exit $status

      # The same walk-cycle rules for games that ship INDIVIDUAL frame files
      # instead of sheets (Newsey). Which checks apply depends on how a game
      # ships its art, so the shape is detected rather than configured: any
      # <id>_down_1.png in a game's art/ directory is a character with a frame
      # set. Missing/duplicate frames fail; "no neutral" warns, because that
      # one is a fuzzy metric and a borderline-but-correct set must not block
      # a deploy.
      - name: Verify character frame sets
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow numpy
          status=0
          for f in games/*/art/*_down_1.png; do
            [ -e "$f" ] || continue
            dir=$(dirname "$f")
            char=$(basename "$f" _down_1.png)
            echo "== $char ($dir) =="
            python3 .github/art/verify_sheet.py frames "$dir" "$char" || status=1
          done
          exit $status

      # Same mechanism HayleysGame's clubhouse already uses in production —
      # after chasing several more elaborate "fixes" here that each added a
      # new bug of their own, reverted back to exactly this.
      - name: Stamp version
        run: echo "window.APP_VERSION = \"v0.${GITHUB_RUN_NUMBER}\";" > version.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Archiving manually (same tar command actions/upload-pages-artifact
      # uses internally) instead of that composite action, because it
      # doesn't expose overwrite control. Without overwrite:true, re-running
      # this workflow after a first attempt already uploaded an artifact
      # leaves two artifacts named "github-pages" behind, and deploy-pages
      # then fails with "Multiple artifacts ... unexpectedly found" — this
      # makes a rerun safe by replacing the old artifact instead.
      - name: Archive site
        run: |
          tar \
            --dereference --hard-dereference \
            --directory "." \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          overwrite: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
