name: Generate image

# Manually triggered only (workflow_dispatch) — never runs on a push, so
# there's no risk of it firing unexpectedly or costing money on its own.
# Trigger it from the Actions tab ("Run workflow"), or Claude can trigger
# it via the GitHub API with the same three inputs.
#
# This is the freeform/one-off action: no persisted style, every prompt
# starts blank. For an asset that should match a game's established look
# (a whole set of sprites/icons), use "Generate game asset" instead — it
# reads games/<id>/art-style.json and locks in that game's camera angle,
# rendering style, palette, and background automatically.
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Image description to send to the model"
        required: true
        type: string
      output_path:
        description: "Where to save it in the repo, e.g. games/trebor/icons/hero.png"
        required: true
        type: string
      size:
        description: "Image size"
        required: false
        type: choice
        options:
          - "1024x1024"
          - "1024x1536"
          - "1536x1024"
        default: "1024x1024"
      quality:
        description: "Render quality — cost rises steeply: low < medium < high. Default medium; bump to high only when the asset really warrants it."
        required: false
        type: choice
        options:
          - "low"
          - "medium"
          - "high"
        default: "medium"
      force:
        description: "Regenerate (and re-bill) even if the output file already exists. Off by default so re-running a batch never pays twice."
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # dispatch pages.yml so the new image actually deploys

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # A room background is NOT a game asset you can ask for here. Rooms are
      # three passes (docs/ROOM_ART_STANDARD.md) and go through the "Generate
      # room pass" Action, which is a button on .github/art/room.py. Asking
      # this Action for one produces the OLD kind of room — scenery painted
      # into the background — which silently invalidates that room's walk mask
      # and every collision number measured against the picture it replaced.
      #
      # This guard exists because that is exactly what happened: bg-lounge.png
      # was regenerated through here, landed, and nothing objected until a
      # human noticed the room was broken.
      - name: Refuse room backgrounds
        env:
          OUTPUT_PATH: ${{ inputs.output_path }}
        run: |
          case "$OUTPUT_PATH" in
            */art/bg-*.png)
              echo "::error::$OUTPUT_PATH is a ROOM BACKGROUND."
              echo "Rooms are generated in three passes — use the 'Generate room pass'"
              echo "Action (game, room, pass=scene|plate|props), or run"
              echo "  python3 .github/art/room.py generate <game> <room> <pass>"
              echo "See docs/ROOM_ART_STANDARD.md and .github/art/README.md."
              exit 1;;
          esac

      - name: Checkout
        uses: actions/checkout@v4

      # THE SAME TRANSPORT EVERY OTHER GENERATOR USES. This used to be its own
      # curl+jq call with model hardcoded to gpt-image-1 and its own retry loop
      # — a second copy of exactly what .github/art/imagegen.py exists to be
      # the one copy of. Routing through it means: the model comes from
      # profiles.py (one place, currently gpt-image-2 — cheaper), every
      # setting is validated against what the API actually accepts before
      # anything is billed, and this file's generations show up in the same
      # provenance manifest (art-src/generated.json) as every other kind of
      # art in the game.
      - name: Generate image
        id: gen
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -s "${{ inputs.output_path }}" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "::notice::${{ inputs.output_path }} already exists — skipping (re-run with force=true to regenerate)."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$(dirname '${{ inputs.output_path }}')"
          python3 .github/art/imagegen.py \
            --prompt "${{ inputs.prompt }}" \
            --output "${{ inputs.output_path }}" \
            --size "${{ inputs.size }}" \
            --quality "${{ inputs.quality }}" \
            --force

      - name: Commit, push, and deploy
        if: steps.gen.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.output_path }}"
          if git commit -m "Generate image: ${{ inputs.prompt }}"; then
            # Retry-with-rebase so several image generations running at once
            # don't clobber each other pushing to main (plain commit+push).
            pushed=""
            for i in 1 2 3 4 5 6; do
              if git pull --rebase origin main && git push; then pushed="yes"; break; fi
              echo "push race, retrying ($i)…"; sleep $((RANDOM % 6 + 2))
            done
            if [ -z "$pushed" ]; then echo "::error::Could not push after retries"; exit 1; fi
            # A GITHUB_TOKEN push does not trigger Pages (recursion prevention),
            # so dispatch the deploy explicitly — workflow_dispatch is the
            # documented exception that DOES fire from GITHUB_TOKEN.
            gh workflow run pages.yml --ref main
          else
            echo "Nothing to commit — skipping deploy"
          fi
