# TRAIN THE PANEL-ATTACK EVALUATOR ON A RUNNER, NOT IN A SANDBOX.
#
# WHY THIS EXISTS. The crank (games/the-game/ai/eval/rounds.sh) runs for
# hours: 200 genomes x 60 generations per round, ~15 minutes a round, four
# workers pinned. It was being run inside the Claude Code sandbox, whose
# microVM is reclaimed between turns and takes every process with it — the
# filesystem survives, no process does. Measured on one night: four
# reclamations in ninety minutes, three runs killed mid-round, each losing
# everything that round had done. Training only ever progressed while
# somebody was actively typing.
#
# A GitHub runner is not reclaimed. ubuntu-latest is 4 vCPU and 16 GB, the
# same shape as the sandbox, and Actions minutes are FREE on a public repo,
# which this is — so this costs nothing to run, unlike anything that bills
# per token. The one constraint is a hard 6-hour job cap, which rounds.sh
# now handles itself via GC_DEADLINE: it refuses to START a round it cannot
# finish, using how long rounds have actually been taking, and exits having
# committed everything it earned.
#
# HOW IT CONTINUES. On a schedule, not by re-dispatching itself: a workflow
# dispatched with GITHUB_TOKEN does not trigger a new run (GitHub blocks that
# to stop runaway loops), so a self-chaining version would need a PAT and
# would fail silently without one. Every 6 hours it starts again and seeds
# from the best committed champion, which is the same resume the sandbox
# restarts already exercise — the champion files ARE the state, and they are
# committed the moment they exist.
name: Train the AI evaluator

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: 'Max rounds this run (it will stop early on the time budget)'
        default: '60'
      generations:
        description: 'Generations per round'
        default: '60'
      population:
        description: 'Genomes per generation'
        default: '200'
      level:
        description: 'Game level to train at'
        default: '10'
  schedule:
    # Every 6 hours. A run takes up to ~5h20m of its own accord, so this is
    # near-continuous without ever overlapping itself.
    - cron: '17 */6 * * *'

# NEVER TWO AT ONCE. Two cranks would fight over the runner's cores and,
# worse, over the same trained.<mode>.json scratch file, and both results
# would be junk. cancel-in-progress is deliberately FALSE: a run that is
# halfway through a round has earned that round, and killing it to start a
# fresher one throws the work away for nothing.
concurrency:
  group: ai-train
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    # Under the 6-hour hard cap, so the job's own timeout is never what stops
    # it — rounds.sh stops first, cleanly, with everything committed.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/newsey-game-ask-qa8u5e
          # The crank commits and pushes each champion as it earns it, so it
          # needs real credentials and full history, not a shallow clone.
          fetch-depth: 0

      # THE ENDLESS DRILL NEEDS A SECOND REPOSITORY. Its opponents are the
      # real attack files from panel-game — the same ones full_report.js
      # plays — and endless is the largest single term in the fitness. The
      # first run of this workflow died on exactly this: bench.js had one
      # absolute path into a sandbox checkout, so eight tests failed with an
      # ENOENT naming a directory no runner could ever have.
      - uses: actions/checkout@v4
        with:
          repository: briankeegan/panel-game
          path: panel-game
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Who is committing
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check the harness before spending five hours on it
        working-directory: games/the-game/ai/eval
        env:
          GC_TRAINING_DIR: ${{ github.workspace }}/panel-game/client/assets/default_data/training
        run: |
          # A broken evaluator would train happily and produce a champion for
          # a game nobody is playing. These are seconds against a 5-hour run.
          node features.test.js
          node puyocpu.test.js
          node training.test.js

      - name: Pick up from the best committed champion
        id: champ
        working-directory: games/the-game/ai/eval
        run: |
          # Same rule as the resume hook: highest trainFitness among results
          # measured on the finals seeds we currently select on. A bar
          # measured on other seeds is not a bar.
          champ=$(node -e '
            var fs = require("fs"), seeds = require("./seeds.js").FINALS.join(",");
            var best = null, bestScore = -Infinity;
            fs.readdirSync(".").filter(function (f) {
              return /^trained\..*\.r[0-9]+\.json$/.test(f);
            }).forEach(function (f) {
              try {
                var d = JSON.parse(fs.readFileSync(f, "utf8"));
                if (!d.finalsSeeds || d.finalsSeeds.join(",") !== seeds) return;
                if (typeof d.trainFitness !== "number") return;
                if (d.trainFitness > bestScore) { bestScore = d.trainFitness; best = f; }
              } catch (e) {}
            });
            if (best) process.stdout.write(best);
          ')
          if [ -n "$champ" ]; then
            echo "champion=$PWD/$champ" >> "$GITHUB_OUTPUT"
            echo "Continuing from $champ"
          else
            echo "champion=" >> "$GITHUB_OUTPUT"
            echo "No valid champion committed — starting from random weights"
          fi

      - name: Crank
        working-directory: games/the-game/ai/eval
        env:
          GC_TRAINING_DIR: ${{ github.workspace }}/panel-game/client/assets/default_data/training
          GC_LEVEL: ${{ github.event.inputs.level || '10' }}
          GC_BRAIN: puyo
          GC_CHAMPION: ${{ steps.champ.outputs.champion }}
        run: |
          # 340 minutes from now, ten under the job timeout: rounds.sh stops
          # itself with room to commit, so the runner never kills it holding
          # a half-finished round.
          export GC_DEADLINE=$(( $(date +%s) + 340 * 60 ))
          ./rounds.sh \
            "${{ github.event.inputs.rounds || 60 }}" \
            "${{ github.event.inputs.generations || 60 }}" \
            "${{ github.event.inputs.population || 200 }}" \
            "$(nproc)"

      - name: What this run achieved
        if: always()
        working-directory: games/the-game/ai/eval
        run: |
          {
            echo "### Champions after this run"
            echo '```'
            node -e '
              var fs = require("fs"), seeds = require("./seeds.js").FINALS.join(",");
              fs.readdirSync(".").filter(function (f) {
                return /^trained\..*\.r[0-9]+\.json$/.test(f);
              }).sort().forEach(function (f) {
                var d = JSON.parse(fs.readFileSync(f, "utf8"));
                if (!d.finalsSeeds || d.finalsSeeds.join(",") !== seeds) return;
                var h = d.holdout && d.holdout.learned && d.holdout.learned.fitness;
                console.log(f.padEnd(46), "finals", String(Math.round(d.trainFitness)).padStart(6),
                            " held-out", String(Math.round(h || 0)).padStart(6));
              });
            ' || echo "(could not read champions)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
