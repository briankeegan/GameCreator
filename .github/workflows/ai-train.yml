# TRAIN THE PANEL-ATTACK EVALUATOR ON A RUNNER, NOT IN A SANDBOX.
#
# WHY THIS EXISTS. The crank (games/the-game/ai/eval/crank.sh) runs ONE
# continuous search for hours: 200 genomes bred generation after generation,
# four workers pinned, snapshotting every 30 generations, stopping when the
# weights settle. It was being run inside the Claude Code sandbox, whose
# microVM is reclaimed between turns and takes every process with it — the
# filesystem survives, no process does. Measured on one night: four
# reclamations in ninety minutes, three runs killed mid-search, each losing
# everything it had done. Training only ever progressed while somebody was
# actively typing.
#
# A GitHub runner is not reclaimed. ubuntu-latest is 4 vCPU and 16 GB, the
# same shape as the sandbox, and Actions minutes are FREE on a public repo,
# which this is — so this costs nothing to run, unlike anything that bills
# per token. The one constraint is a hard 6-hour job cap, which train.js
# handles itself via GC_DEADLINE: it stops cleanly at a generation boundary
# with a snapshot written, rather than being killed mid-generation.
#
# HOW IT CONTINUES. On a schedule, not by re-dispatching itself: a workflow
# dispatched with GITHUB_TOKEN does not trigger a new run (GitHub blocks that
# to stop runaway loops), so a self-chaining version would need a PAT and
# would fail silently without one.
#
# THERE IS NOTHING TO SEED FROM, and that is the point. This used to hunt for
# the best committed champion and start a fresh search from it — the round
# boundary that cost three layers of patches (see crank.sh). The search is
# continuous now and train.js's checkpoint carries the whole population, so a
# new run resumes at the generation the last one stopped on with every genome
# intact, rather than restarting from a single winner.
name: Train the AI evaluator

on:
  workflow_dispatch:
    inputs:
      population:
        description: 'Genomes per generation'
        default: '200'
      level:
        description: 'Game level to train at'
        default: '10'
      exclude:
        description: 'Features to leave OUT of the genome (comma list, blank = all)'
        default: ''
      variant:
        description: 'Label for this experiment, used in the snapshot filenames'
        default: ''
      ga_seed:
        description: 'Search RNG seed. CHANGE IT to get an independent run of the same config'
        default: ''
      depth:
        description: 'Lookahead depth. 1 = greedy (every run before this). 2 = beam search'
        default: '1'
      beam:
        description: 'Candidates expanded at depth > 1. Ignored at depth 1'
        default: '6'
      rise:
        description: 'Rise-adjusted scoring: score every candidate one row later (1 = on)'
        default: ''
      density:
        description: 'Density scoring: counts made of panels become per-panel (1 = on)'
        default: ''

# THE SCHEDULE IS OFF WHILE FEATURES ARE BEING MEASURED ONE AT A TIME.
#
# It was every 6 hours, which is near-continuous for a ~5h20m run and was
# right while there was one experiment. It is wrong now: the concurrency
# group below serialises everything, cancel-in-progress is false, and a
# scheduled full-registry run queued between two variant runs would push each
# one hours later while answering a question nobody asked yet. staircase and
# flatTop have to be measured SEPARATELY before they are combined, and the
# combined run is the third dispatch, not a side effect of the clock.
#
# Put it back when the variants are done — that is when a standing run is
# useful again, and it is one uncommented line:
#   schedule:
#     - cron: '17 */6 * * *'

# NEVER TWO AT ONCE. Two cranks would fight over the runner's cores and,
# worse, over the same trained.<mode>.json scratch file, and both results
# would be junk. cancel-in-progress is deliberately FALSE: a run that is
# halfway through a round has earned that round, and killing it to start a
# fresher one throws the work away for nothing.
# ONE PER EXPERIMENT, NOT ONE IN TOTAL.
#
# The group used to be a bare "ai-train" and the reason given was that two
# cranks would fight over the runner's cores and over the same
# trained.<mode>.json scratch file. The first half was never true — every run
# gets its OWN runner, so there are no cores to share — and the second half is
# only true of two runs on one machine, which this has never been.
#
# It also does not do what it looks like it does when more than one run is
# waiting: GitHub keeps a single pending run per group, so dispatching the
# staircase and flatTop variants back to back would have CANCELLED the first
# of them, silently, and left one experiment looking like two.
#
# Keyed by variant, the two variant runs go in parallel and finish in the time
# one of them takes. What still must not double up is two runs of the SAME
# experiment, which is what the key preserves. They race only on the push of a
# snapshot, and commit_snapshot.sh already rebases before pushing for exactly
# that reason.
concurrency:
  group: ai-train-${{ github.event.inputs.variant || 'default' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    # Under the 6-hour hard cap, so the job's own timeout is never what stops
    # it — train.js stops first, at a generation boundary, snapshot written.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          # MAIN, NOT A SESSION BRANCH. This was pinned to a working branch,
          # which meant a run took its code AND wrote its snapshots there —
          # so the workflow on main and the workflow being run could drift
          # apart, and they did: main gained the depth/beam inputs while the
          # branch copy went without them for long enough to dispatch six
          # runs that measured nothing. Everything lives on main.
          ref: main
          # The crank commits and pushes each champion as it earns it, so it
          # needs real credentials and full history, not a shallow clone.
          fetch-depth: 0

      # THE ENDLESS DRILL NEEDS A SECOND REPOSITORY. Its opponents are the
      # real attack files from panel-game — the same ones full_report.js
      # plays — and endless is the largest single term in the fitness. The
      # first run of this workflow died on exactly this: bench.js had one
      # absolute path into a sandbox checkout, so eight tests failed with an
      # ENOENT naming a directory no runner could ever have.
      - uses: actions/checkout@v4
        with:
          repository: briankeegan/panel-game
          path: panel-game
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Who is committing
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check the harness before spending five hours on it
        working-directory: games/the-game/ai/eval
        env:
          GC_TRAINING_DIR: ${{ github.workspace }}/panel-game/client/assets/default_data/training
        run: |
          # A broken evaluator would train happily and produce a champion for
          # a game nobody is playing. These are seconds against a 5-hour run.
          node features.test.js
          node puyocpu.test.js
          node training.test.js
          # rise.test.js needs GC_TRAINING_DIR (set above) — it refuses to
          # run on a garbage-free board, where the effect it measures reads
          # as a fifth of its real size.
          node rise.test.js
          node density.test.js

      - name: Crank
        working-directory: games/the-game/ai/eval
        env:
          GC_TRAINING_DIR: ${{ github.workspace }}/panel-game/client/assets/default_data/training
          GC_LEVEL: ${{ github.event.inputs.level || '10' }}
          GC_BRAIN: puyo
          # Read by train.js, which drops these keys from the genome rather
          # than pinning them at zero, and refuses a name that is not a
          # feature. Blank means the full registry, which is what every run
          # before this one did.
          GC_EXCLUDE: ${{ github.event.inputs.exclude || '' }}
          # Read by crank.sh, which puts it in the tag so two runs that
          # differ only by their feature set do not write indistinguishable
          # snapshot filenames.
          GC_VARIANT: ${{ github.event.inputs.variant || '' }}
          # THE SEED WAS THE REASON TWO RUNS AGREED TO THE LAST DIGIT.
          #
          # train.js defaults GC_GA_SEED to a fixed constant and nothing ever
          # set it, so run 5 and run 6 were not a result and its
          # reproduction — they were the same search walked twice, finishing
          # at 3397 at generation 360 both times. train.js's own comment
          # warns about exactly this ("noise does not repeat to the last
          # digit") and the variable was left unreachable from here.
          #
          # It matters beyond tidiness: with no way to change the seed there
          # is no way to measure the search's own spread, and without that
          # number a variant scoring 2883 against a baseline's 3397 cannot be
          # told apart from the baseline's own 3784 -> 3146 -> 3397 wobble.
          # Blank keeps the historical default, so every earlier run stays
          # comparable.
          GC_GA_SEED: ${{ github.event.inputs.ga_seed || '' }}
          # WEIGHTS DESCRIBE A BOT, NOT A BOARD. The shipped set scores
          # 14780 points under depth 1 and 2550 under depth 2 — a third,
          # from changing nothing but how the move is chosen. A lookahead
          # bot cannot borrow greedy weights; it needs its own search, and
          # its result is only comparable against a baseline at the same
          # depth. Blank is depth 1, which is every run before this one.
          GC_DEPTH: ${{ github.event.inputs.depth || '1' }}
          GC_BEAM: ${{ github.event.inputs.beam || '6' }}
          # Same rule, second axis: rise-adjusted scoring produces a
          # different bot again, so its weights are only comparable against
          # a baseline that also has it. Blank is off — every run so far.
          GC_RISE: ${{ github.event.inputs.rise || '' }}
          GC_DENSITY: ${{ github.event.inputs.density || '' }}
        run: |
          # 340 minutes from now, ten under the job timeout: train.js stops
          # itself with room to commit, so the runner never kills it holding
          # a half-finished round.
          export GC_DEADLINE=$(( $(date +%s) + 340 * 60 ))
          ./crank.sh "${{ github.event.inputs.population || 200 }}" "$(nproc)"

      - name: What this run achieved
        if: always()
        working-directory: games/the-game/ai/eval
        run: |
          {
            echo "### Champions after this run"
            echo '```'
            node -e '
              var fs = require("fs"), seeds = require("./seeds.js").FINALS.join(",");
              fs.readdirSync(".").filter(function (f) {
                return /^trained\..*\.g[0-9]+\.json$/.test(f);
              }).sort().forEach(function (f) {
                var d = JSON.parse(fs.readFileSync(f, "utf8"));
                if (!d.finalsSeeds || d.finalsSeeds.join(",") !== seeds) return;
                var h = d.holdout && d.holdout.learned && d.holdout.learned.fitness;
                console.log(f.padEnd(46), "finals", String(Math.round(d.trainFitness)).padStart(6),
                            " held-out", String(Math.round(h || 0)).padStart(6));
              });
            ' || echo "(could not read champions)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
