name: Browser checks

# THE DOOR TESTS RAN NOWHERE. Every one of them — direction, arrival,
# roundtrip, reachability — was hand-run, which meant the only thing standing
# between a broken door and a player was somebody remembering to type the
# command. It wasn't remembered: doors that arrived in the wrong place, fired
# when brushed, got you stuck walking back, and showed rooms half-loaded were
# all found by playing the game, one report at a time.
#
# They are NOT in pages.yml, and that is deliberate — see the comment there.
# Those need Playwright and have shown real timing flakiness in this
# environment, and one game's flaky animation timing must never block every
# game's deploy. A SEPARATE workflow is how both things can be true: this can
# go red on its own without the site going down with it.
#
# A flake still costs a red check nobody should chase, so a failing run is
# retried once and only a second failure is reported. That is the same bargain
# the art Actions make with OpenAI's rate limiter: retry the transient, report
# the real.
on:
  push:
    branches: ["main"]
    paths:
      - "games/**"
      - ".github/scripts/**"
      - ".github/workflows/browser-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doors:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        timeout-minutes: 8
        run: npm install --no-save playwright@1 && npx playwright install --with-deps chromium

      - name: Door checks
        timeout-minutes: 15
        run: |
          status=0
          run_twice () {
            echo "== $* =="
            if node "$@"; then return 0; fi
            echo "::warning::first attempt failed, retrying once in case it is timing flake: $*"
            sleep 5
            node "$@" || return 1
          }
          # Every door lands on its partner's rectangle — you come out where
          # you would go in.
          run_twice .github/scripts/door-arrival.test.js   || status=1
          # A door opens only for someone walking the way it faces.
          run_twice .github/scripts/door-direction.test.js || status=1
          # Through a door, back again, and through once more.
          run_twice .github/scripts/door-roundtrip.test.js || status=1
          # Every door can actually be reached, through the GAME's own
          # collision rather than a static model of it.
          run_twice .github/scripts/check_door_reach.mjs games/the-game || status=1
          exit $status

      # A duel played out in the page on the server's rules: the trained bot on
      # both boards, garbage both ways, no page error.
      - name: Duel check
        if: success() || failure()
        timeout-minutes: 6
        run: node games/the-game/duel.test.js || { sleep 5; node games/the-game/duel.test.js; }

      # HYPERGOLIC HULL'S PLAYTHROUGH RAN NOWHERE EITHER — the same hole this
      # workflow was built to close, one game over. It drives the real UI in a
      # real browser for about ninety seconds, which is far too slow to sit on
      # a commit, so it was run by hand and therefore run when somebody
      # remembered. Here it runs on every push to main instead, red on its own
      # without taking the deploy down with it.
      - name: Hypergolic Hull playthrough
        if: success() || failure()
        timeout-minutes: 8
        run: |
          node games/hypergolic-hull/browser.test.js || {
            echo "::warning::first attempt failed, retrying once in case it is timing flake"
            sleep 5
            node games/hypergolic-hull/browser.test.js
          }

      # AND A HANDFUL OF FULL RUNS, for one thing only: that nothing throws.
      # The harness measures far more than that, but measurement is a thing
      # you read, not a thing that passes or fails, and thirty runs take
      # minutes. Six is enough to catch a rule that crashes the engine — which
      # it has: the Pin Lance refused a shot its own fire controls had already
      # offered, on about one run in thirty, and took the player's turn with it.
      - name: Hypergolic Hull full runs do not throw
        if: success() || failure()
        timeout-minutes: 8
        run: node games/hypergolic-hull/playtest.js 6
