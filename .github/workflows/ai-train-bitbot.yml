# THE ISLAND LOOP FOR BITBOT, ONE RUN PER SEED.
#
# Separate from ai-train-pbt.yml because it trains a DIFFERENT BOT. BitBot reads
# its own feature set (bitfeatures.js, 20 features) and its survival is
# arithmetic rather than weights -- the plan objective in bitbot.js ranks by
# frames of life bought per frame spent and the weights never see it. So what
# this searches is the ATTACK: which shapes the bot builds toward when it is not
# saving itself. A vector from here means nothing to the PuyoCpu trainer and
# vice versa.
#
# WHY A FAN-OUT OF INDEPENDENT RUNS AND NOT ONE LONGER RUN. The first island run
# did not converge. Over ten generations at one seed a pairing, the untrained
# control won three of them and placed 1st, 3rd, 4th and 5th with weights that
# never changed; winning scores sat flat at 5 to 6 of 7 and garbage sent drifted
# DOWN. A champion decided by seven duels is a champion decided by noise, and
# running more generations of that amplifies the noise rather than the signal.
#
# One run of one condition measures nothing. Twenty seeds give a distribution,
# and the null result is countable: `controlWins` in each champion file says how
# many generations the untrained hand-set vector took. If that is high across the
# fan-out, the search found nothing and no vector from any run should be shipped.
name: Train BitBot (islands)

on:
  workflow_dispatch:
    inputs:
      ga_seed:
        description: 'RNG seed. CHANGE IT for an independent run of the same config -- that is the whole point of the fan-out'
        default: '11'
      variant:
        description: 'Label for this experiment, used in the champion filename and in the concurrency key'
        default: ''
      population:
        description: 'Weight vectors in the population. Island 0 is always BitBot.STARTER, the control. Duels per generation are C(population,2) x seeds, so this is the quadratic term in the run length'
        default: '4'
      generations:
        description: 'Generations. Each one duels every pairing, keeps the top half and refills with their mutated children'
        default: '3'
      seeds:
        description: 'Seeds per pairing. ONE IS THE NOISE FLOOR -- a champion decided by a handful of duels is decided by the draw, which is what the first run measured'
        default: '2'
      chain:
        description: 'false = run once and stop. Otherwise the run dispatches its own continuation under the same tag, which RESUMES its champion -- so generations accumulate across runs and the fan-out rotates for as long as it is left alone'
        default: 'true'
      ceiling:
        description: 'Frames before a duel is called. Sized for the fitness, not for the game: nothing dies any more, so what is measured at the ceiling is garbage sent. 30000 frames is 8m20s of play at 60fps and about 60s a duel'
        default: '30000'

# THE SEED IS IN THE KEY, NOT JUST THE VARIANT.
#
# A fan-out that sets ga_seed and leaves variant empty puts every job in one
# group named `default`, where only one can be pending -- so all but one are
# cancelled within seconds of being dispatched and the fan-out silently becomes a
# single run. That has happened twice in this repo (see ai-train-pbt.yml) and it
# reads from outside as runs dying rather than as jobs never starting.
#
# cancel-in-progress is FALSE: a run that has done its generations has earned
# them.
concurrency:
  group: ai-train-bitbot-${{ github.event.inputs.variant || 'default' }}-s${{ github.event.inputs.ga_seed || '11' }}
  cancel-in-progress: false

permissions:
  contents: write
  # ...and to dispatch its own continuation. Without this the chaining step gets
  # HTTP 403 "Resource not accessible by integration" and the rotation stops
  # after one run, with the training itself having succeeded.
  actions: write

jobs:
  islands:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # SHALLOW, BECAUSE THE CLONE WAS THE RUN.
      #
      # fetch-depth: 0 fetches every commit ever made, and this repo carries
      # thousands of trainer snapshots and the art assets. Measured on run 60:
      # checkout took 10 minutes 5 seconds of a run whose duels take nine, and
      # twenty runners each paid it.
      #
      # The job commits its champion back, which is why full history looked
      # necessary -- it is not. A shallow clone commits onto main perfectly well,
      # and the delivery fetches origin/main before it rebases anyway.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Who is committing
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # SECONDS AGAINST MINUTES. A run that searches with a broken evaluator has
      # measured nothing, and these are the checks that say the evaluator is the
      # one the bot will actually play with. Thirty seconds, measured.
      - name: Check the harness before spending the run on it
        working-directory: games/the-game/ai/eval
        timeout-minutes: 20
        run: |
          node bitmatch.test.js
          node bitoptions.test.js
          node bitfeatures.test.js
          node bitbot.test.js

      - name: Islands
        id: train
        working-directory: games/the-game/ai/eval
        timeout-minutes: 40
        env:
          GC_GA_SEED: ${{ github.event.inputs.ga_seed || '11' }}
          GC_TAG: bitbot-${{ github.event.inputs.variant || 'default' }}-s${{ github.event.inputs.ga_seed || '11' }}
          GC_VERSUS_CEILING: ${{ github.event.inputs.ceiling || '30000' }}
          # One shard per core on the runner, which is four.
          GC_SHARDS: '4'
          # Push the champion as each generation earns it, so a run that is
          # cancelled or times out still leaves behind what it found.
          GC_DELIVER: '1'
        run: |
          node bitbot_islands.js \
            "${{ github.event.inputs.population || '6' }}" \
            "${{ github.event.inputs.generations || '9' }}" \
            "${{ github.event.inputs.seeds || '2' }}" \
            | tee run.log
          echo "tag=bitbot-${{ github.event.inputs.variant || 'default' }}-s${{ github.event.inputs.ga_seed || '11' }}" >> "$GITHUB_OUTPUT"

      # A BACKSTOP, NOT THE DELIVERY. The loop pushes every generation now; this
      # catches the case where the last one lost its race, and prints what the run
      # found so the result is readable from the job without opening the file.
      - name: Deliver the champion
        if: always() && steps.train.outcome == 'success'
        working-directory: games/the-game/ai/eval
        run: |
          TAG="${{ steps.train.outputs.tag }}"
          FILE="islands/bitbot.island.$TAG.json"
          echo "--- what this run found ---"
          grep -E '^(gen|FINAL)' run.log || true
          if [ ! -f "$FILE" ]; then
            echo "no champion at $FILE -- the run did not finish a single generation"
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            git add "$FILE"
            git commit -m "BitBot island champion $TAG

          controlWins is how many generations the UNTRAINED control took. High
          means this run found nothing, which is a result and not a failure." || true
            if git push origin HEAD:main; then
              echo "delivered on attempt $attempt"
              exit 0
            fi
            echo "push lost the race, rebasing (attempt $attempt)"
            git fetch origin main
            git rebase origin/main || git rebase --abort
            sleep $((attempt * 5))
          done
          echo "could not deliver after 5 attempts"
          exit 1

      # THE ROTATION. Each run continues its own tag, and because seedPopulation
      # reopens the champion committed under that tag, the next run breeds from
      # this one -- three generations a run, accumulating for as long as the chain
      # is left running. Same shape as ai-train-pbt.yml's continuation.
      #
      # STOP_TRAINING on main ends it, so a chain can be stopped without touching
      # the Actions UI.
      - name: Dispatch the next leg
        if: github.event.inputs.chain != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          git fetch -q origin main
          if git cat-file -e origin/main:games/the-game/ai/eval/STOP_TRAINING 2>/dev/null; then
            echo "STOP_TRAINING is on main -- not continuing."
            exit 0
          fi
          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ai-train-bitbot.yml/dispatches" \
            -d '{"ref":"main","inputs":{"ga_seed":"${{ github.event.inputs.ga_seed }}","variant":"${{ github.event.inputs.variant }}","population":"${{ github.event.inputs.population }}","generations":"${{ github.event.inputs.generations }}","seeds":"${{ github.event.inputs.seeds }}","ceiling":"${{ github.event.inputs.ceiling }}","chain":"true"}}')
          if [ "$code" != "204" ]; then
            echo "the continuation was REFUSED (HTTP $code) -- this chain ends here:"
            cat /tmp/dispatch.out
            exit 1
          fi
          echo "next leg dispatched"

