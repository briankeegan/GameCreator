name: Gambit 28

# A Gambit profile plays all 28 training games in the real client's Training mode -- 8 each of combo_storm, factory and
# large_garbage and 4 endless (no garbage, six minutes), every game a job of its own, as training-mode.yml plays one pattern -- and a report job reads all 28 games'
# logs and writes the run up: games/the-game/ai/eval/gambit_summary.js (survived per mode, the frames lost at, combos and
# chains, the budgets), gambit_losses.js (the decisions before each loss), gambit_reach.js (was the break there; the turn).
# The summary is the run's notices; every report is the gambit-report artifact. With report_run, nothing is played: that run's games
# are written up again by this commit's reports.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'The Gambit profile, relative to games/the-game/ai/eval'
        default: 'survivor-profiles/gambit-finish.json'
      frames:
        description: 'A game survived this many frames counts as survived and ends (21600 = six minutes)'
        default: '21600'
      panel_ref:
        description: 'The panel-game commit or branch the games play on (default: real-time play with PA_DRAW_EVERY, and the endless pattern)'
        default: '5c6c3231a97c3faad163c5e9bb0d35c53eaf5d4a'
      report_run:
        description: 'A past run of this workflow: its games written up again, nothing played'
        default: ''
      workers:
        description: "Gambit's worker threads (GC_GAMBIT_WORKERS; none when empty): four -- the break search, the planner's second half and the chain, the survival search, the break search's wider beam"
        default: '4'
      bot:
        description: 'gambit (in the client, libgambit.so; needs a panel_ref with PA_BOT=gambit) or wasm (survivor.js beside it)'
        default: 'gambit'
      seed:
        description: 'The panel seed base (PA_SEED = base*100 + pattern*10 + game: every game the same panels every run); empty (the default) for random -- every run new games'
        default: ''
      patterns:
        description: 'The patterns played, a JSON list (one pattern worked on alone: its 8 games, endless 4; the goal is measured on all four -- endless: no garbage ever, the board must not die of its own rise)'
        default: '["combo_storm","factory","large_garbage","endless"]'
      games:
        description: 'The games of each pattern played, a JSON list of their numbers (one game worked on alone: [4]); endless has 1 to 4'
        default: '[1,2,3,4,5,6,7,8]'
      gambit_from:
        description: 'A commit whose Gambit (games/the-game/ai/gambit) is played instead of this one, on these seeds and this harness -- a build before measured again on the same games; empty for this commit'
        default: ''
      rounds:
        description: "The rounds played, a JSON list: each round plays every pattern's 8 games again on seeds of its own (round r: seed base + r - 1), so a build is measured on more games than one run holds"
        default: '[1]'
      fight:
        description: "1: training played as a fight (GC_GAMBIT_FIGHT) -- an opponent there from the countdown on, low, never topped, so the opening is found as a live fight finds it; with a profile that names no mode (survivor-profiles/gambit.json)"
        default: ''
      blind:
        description: "1: the senders' telegraphs hidden (GC_GAMBIT_BLIND) -- garbage known only once it is in the bot's own queue, as the live server's loose sync delivers it"
        default: ''
      enemy:
        description: "virtual: a training fight's enemy a stack that moves as players' do, takes our garbage and digs it out (GC_GAMBIT_ENEMY) -- for a rule that reads the enemy's room"
        default: ''
      then:
        description: "The modes an opener gives way to at the top-out, a JSON list (`_` for a space: [\"finish_them\",\"big_chain\",\"pressure\",\"build\"]): every game is played once per mode on the same seed (GC_GAMBIT_THEN); [\"rotate\"]: each game one mode, in turn; none: the profile's mode all game"
        default: '[""]'
      parent_run:
        description: 'Set by a game a slow runner skipped: the run it belongs to (its games are written up there); empty for a run of its own'
        default: ''
      hops:
        description: 'Set by a game a slow runner skipped: the times it has been dispatched again (from 3 on it plays on whatever runner it gets)'
        default: '0'
      stop_after:
        description: "Frames: a game ends alive this long after the enemy first tops out (GC_STOP_AFTER_HANDOVER; needs a panel_ref whose training loop reads GC_TRAINING_STOP_AT) -- the opener measured to its handover and the seconds after; empty: the frames input alone"
        default: ''

run-name: ${{ inputs.parent_run != '' && format('Gambit 28, a game for {0}', inputs.parent_run) || 'Gambit 28' }}

permissions:
  contents: read
  actions: read

jobs:
  play:
    if: ${{ inputs.report_run == '' }}
    runs-on: ubuntu-24.04   # (pinned: ubuntu-latest put some jobs on a 26.04 image whose apt finds no luajit, clang or libfuse2)
    timeout-minutes: 350
    permissions:
      contents: read
      actions: write   # (a game a slow runner skipped is dispatched again at once)
    strategy:
      fail-fast: false
      max-parallel: 29   # (the runners are shared: one run at a time, 30 jobs at most with the report)
      matrix:
        pattern: ${{ fromJSON(inputs.patterns || '["combo_storm","factory","large_garbage","endless"]') }}
        game: ${{ fromJSON(inputs.games || '[1,2,3,4,5,6,7,8]') }}
        # (endless plays 4 games: 28 a run with the three garbage patterns' 24)
        exclude:
          - { pattern: endless, game: 5 }
          - { pattern: endless, game: 6 }
          - { pattern: endless, game: 7 }
          - { pattern: endless, game: 8 }
        round: ${{ fromJSON(inputs.rounds || '[1]') }}
        then: ${{ fromJSON(inputs.then || '[""]') }}
    steps:
      # THE RUNNERS (plans/gambit-goal.md, the runners: skip by model, never by vendor): a slower model searches less in a decision's time
      # and loses more -- on one of the models named, the game is dispatched again at once as a run of its own (parent_run: this run, whose
      # report waits for it and writes it up) and this job plays nothing -- as many times as it takes
      - name: Skip a slow runner
        id: skip
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          HOPS: ${{ inputs.hops || '0' }}
          PARENT: ${{ inputs.parent_run || github.run_id }}
          M_PATTERN: ${{ matrix.pattern }}
          M_GAME: ${{ matrix.game }}
          M_ROUND: ${{ matrix.round }}
          M_THEN: ${{ matrix.then }}
          I_PROFILE: ${{ inputs.profile }}
          I_FRAMES: ${{ inputs.frames }}
          I_PANEL: ${{ inputs.panel_ref }}
          I_WORKERS: ${{ inputs.workers }}
          I_BOT: ${{ inputs.bot }}
          I_SEED: ${{ inputs.seed }}
          I_GAMBIT: ${{ inputs.gambit_from }}
          I_FIGHT: ${{ inputs.fight }}
          I_BLIND: ${{ inputs.blind }}
          I_ENEMY: ${{ inputs.enemy }}
          I_STOP: ${{ inputs.stop_after }}
        run: |
          model=$(lscpu | sed -n 's/^Model name: *//p' | head -1)
          echo "runner: $model, dispatched again $HOPS times"
          if echo "$model" | grep -qiE '8573C|7763|9V74'; then
            for i in 1 2 3; do gh workflow run gambit-24.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
              -f profile="$I_PROFILE" -f frames="$I_FRAMES" -f panel_ref="$I_PANEL" -f workers="$I_WORKERS" -f bot="$I_BOT" -f seed="$I_SEED" \
              -f gambit_from="$I_GAMBIT" -f fight="$I_FIGHT" -f blind="$I_BLIND" -f enemy="$I_ENEMY" -f stop_after="$I_STOP" \
              -f patterns="[\"$M_PATTERN\"]" -f games="[$M_GAME]" -f rounds="[$M_ROUND]" -f then="[\"$M_THEN\"]" \
              -f parent_run="$PARENT" -f hops="$((HOPS + 1))" && break; sleep 10; done
            echo "skipped runner: $model -- $M_PATTERN $M_GAME dispatched again for run $PARENT" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=skipped runner::$model: $M_PATTERN $M_GAME dispatched again"
            echo "skipped=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: ${{ steps.skip.outputs.skipped != '1' }}
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: The Gambit of another commit
        if: ${{ inputs.gambit_from != '' && steps.skip.outputs.skipped != '1' }}
        env:
          GAMBIT_FROM: ${{ inputs.gambit_from }}
        run: |
          from=$(awk -v n="$GAMBIT_FROM" '$1 == n { print $2 }' games/the-game/ai/eval/gambit-versions.txt); from=${from:-$GAMBIT_FROM}
          # (a short commit hash cannot be fetched by itself: resolved first against the branches' history)
          case "$from" in *[!0-9a-f]*) ;; *) if [ ${#from} -lt 40 ]; then git fetch -q --filter=blob:none $([ -f .git/shallow ] && echo --unshallow) origin '+refs/heads/*:refs/remotes/origin/*' && from=$(git rev-parse --verify "$from^{commit}"); fi;; esac
          # (that one commit fetched alone, not the history -- and no file of it until checked out: only the gambit folder's are fetched,
          # not the whole tree's -- with the engine it is built on, eval/native)
          for i in 1 2 3; do timeout 120 git fetch --depth 1 --filter=blob:none --quiet origin "$from" && break; sleep 5; done
          rm -rf games/the-game/ai/gambit games/the-game/ai/eval/native && git checkout FETCH_HEAD -- games/the-game/ai/gambit games/the-game/ai/eval/native
          echo "::notice title=gambit::the Gambit of ${{ inputs.gambit_from }}"
      - uses: actions/checkout@v4
        if: ${{ steps.skip.outputs.skipped != '1' }}
        with:
          repository: briankeegan/panel-game
          ref: ${{ inputs.panel_ref || '5c6c3231a97c3faad163c5e9bb0d35c53eaf5d4a' }}
          path: panel-game
          fetch-depth: 1
      - uses: actions/setup-node@v4
        if: ${{ steps.skip.outputs.skipped != '1' }}
        with:
          node-version: '22'
      # (love from the cache when a job before this one fetched it: the release download returns 504 for minutes at a time, and a job
      # without love plays no game)
      - name: love, cached
        if: ${{ steps.skip.outputs.skipped != '1' }}
        id: lovecache
        timeout-minutes: 5
        uses: actions/cache@v4
        with:
          path: /tmp/love.tar.gz
          key: love-12.0-linux-x86_64
      - name: xvfb, love and clang
        if: ${{ steps.skip.outputs.skipped != '1' }}
        timeout-minutes: 15
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120"
          for i in 1 2 3; do timeout 240 sudo apt-get $APT update || true; timeout 240 sudo apt-get $APT install -y libfuse2 xvfb clang luajit zlib1g-dev && break; sleep 10; done   # (an update one source fails still updates the others: the install is tried anyway)
          mkdir -p ~/love2d
          [ -s /tmp/love.tar.gz ] || for i in 1 2 3 4 5 6; do curl -fsSL "https://github.com/panel-attack/panel-game/releases/download/love2d-12.0/love-12.0-linux-x86_64.tar.gz" -o /tmp/love.tar.gz && break; sleep $((i * 15)); done
          tar -xzf /tmp/love.tar.gz -C ~/love2d
          mv ~/love2d/*.AppImage ~/love2d/love.AppImage
          chmod +x ~/love2d/love.AppImage
      - name: Gambit sees only what the screen shows
        if: ${{ steps.skip.outputs.skipped != '1' }}
        timeout-minutes: 2
        run: luajit games/the-game/ai/gambit/lua/board.test.lua
      - name: Play
        if: ${{ steps.skip.outputs.skipped != '1' }}
        timeout-minutes: 340
        env:
          PG: ${{ github.workspace }}/panel-game
          LOVE: /home/runner/love2d/love.AppImage
          OUT_DIR: ${{ github.workspace }}/out
          PROFILE: ${{ inputs.profile }}
          FRAMES: ${{ inputs.frames }}
          MINUTES: '60'
          GC_GAMBIT_WORKERS: ${{ inputs.workers }}
          SEED_BASE: ${{ inputs.seed }}
          GC_GAMBIT_THEN: ${{ matrix.then }}
          GC_STOP_AFTER_HANDOVER: ${{ inputs.stop_after }}
          GC_GAMBIT_FIGHT: ${{ inputs.fight }}
          GC_GAMBIT_BLIND: ${{ inputs.blind }}
          GC_GAMBIT_ENEMY: ${{ inputs.enemy }}
        run: |
          # (rotate: game g gives way to the g-th of the four modes in turn, so the 28 games try each mode seven times)
          if [ "$GC_GAMBIT_THEN" = rotate ]; then M=(finish_them big_chain pressure build); export GC_GAMBIT_THEN=${M[$(( (${{ matrix.game }} - 1) % 4 ))]}; fi
          if [ -n "$SEED_BASE" ]; then
            case "${{ matrix.pattern }}" in combo_storm) P=1;; factory) P=2;; large_garbage) P=3;; endless) P=4;; *) P=9;; esac
            export PA_SEED=$(((SEED_BASE + ${{ matrix.round }} - 1) * 100 + P * 10 + ${{ matrix.game }}))
            echo "::notice title=seed::${{ matrix.pattern }} ${{ matrix.game }} round ${{ matrix.round }}: PA_SEED=$PA_SEED"
          fi
          echo "::notice title=cores::$(nproc) threads, $(lscpu | awk -F: '/^Core\(s\) per socket|^Thread\(s\) per core/ {gsub(/ +/, " ", $2); printf "%s:%s, ", $1, $2}')cpu:core $(lscpu -e=CPU,CORE | tail -n +2 | awk '{printf "%s:%s ", $1, $2}'), GC_GAMBIT_WORKERS=$GC_GAMBIT_WORKERS"
          # (the runner's CPU written beside the game: a slower one gives the search less in the same frame -- every game can be read by it)
          mkdir -p out; echo "runner cpu: $(lscpu | sed -n 's/^Model name: *//p' | head -1), $(nproc) threads, $(lscpu | sed -n 's/^CPU max MHz: *//p' | head -1) MHz max" > out/cpu.txt
          # (the game ahead of everything else on the runner: this shell at nice -10, which the game and every thread it starts inherit -- the
          # runner's own processes no longer take the game's core mid-frame; Gambit's workers stay at the idle class)
          sudo renice -n -10 -p $$ > /dev/null || echo "::warning title=nice::the game plays at the runner's own priority"
          bash games/the-game/ai/eval/training.sh "${{ inputs.bot || 'gambit' }}" "${{ matrix.pattern }}" 1
      - name: Results
        if: ${{ always() && steps.skip.outputs.skipped != '1' }}
        run: grep -h '^game ' out/results.txt 2>/dev/null | sed 's/^/::notice title=${{ matrix.pattern }} ${{ matrix.game }} r${{ matrix.round }}::/' || true
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.skip.outputs.skipped != '1' }}
        timeout-minutes: 5
        with:
          name: gambit-${{ matrix.pattern }}-${{ matrix.game }}${{ matrix.round > 1 && format('-r{0}', matrix.round) || '' }}${{ matrix.then != '' && format('-{0}', matrix.then) || '' }}
          path: |
            out/results.txt
            out/survivor.log
            out/cpu.txt
          if-no-files-found: warn
          retention-days: 14

  # (the code's checks, once a run beside the games: a check that fails turns the run red without stopping a game)
  checks:
    if: ${{ inputs.report_run == '' && inputs.parent_run == '' }}
    runs-on: ubuntu-24.04   # (pinned: ubuntu-latest put some jobs on a 26.04 image whose apt finds no luajit, clang or libfuse2)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: The Gambit of another commit
        if: ${{ inputs.gambit_from != '' }}
        env:
          GAMBIT_FROM: ${{ inputs.gambit_from }}
        run: |
          from=$(awk -v n="$GAMBIT_FROM" '$1 == n { print $2 }' games/the-game/ai/eval/gambit-versions.txt); from=${from:-$GAMBIT_FROM}
          # (a short commit hash cannot be fetched by itself: resolved first against the branches' history)
          case "$from" in *[!0-9a-f]*) ;; *) if [ ${#from} -lt 40 ]; then git fetch -q --filter=blob:none $([ -f .git/shallow ] && echo --unshallow) origin '+refs/heads/*:refs/remotes/origin/*' && from=$(git rev-parse --verify "$from^{commit}"); fi;; esac
          # (that one commit fetched alone, not the history -- and no file of it until checked out: only the gambit folder's are fetched,
          # not the whole tree's -- with the engine it is built on, eval/native)
          for i in 1 2 3; do timeout 120 git fetch --depth 1 --filter=blob:none --quiet origin "$from" && break; sleep 5; done
          rm -rf games/the-game/ai/gambit games/the-game/ai/eval/native && git checkout FETCH_HEAD -- games/the-game/ai/gambit games/the-game/ai/eval/native
      - name: clang
        timeout-minutes: 10
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120"
          for i in 1 2 3; do timeout 240 sudo apt-get $APT update || true; timeout 240 sudo apt-get $APT install -y clang luajit zlib1g-dev && break; sleep 10; done
      - name: Gambit's C checks (the bits, perched blocks, the decisions replayed against the golden)
        timeout-minutes: 15
        # (and again on two workers: the readiness searched on every thread -- every check but the golden, which their search may move)
        run: cd games/the-game/ai/gambit && ./build.sh test && GC_GAMBIT_WORKERS=2 ./build.sh test && ./build.sh tsan > /dev/null

  report:
    needs: play
    if: ${{ always() && inputs.parent_run == '' }}
    runs-on: ubuntu-24.04   # (pinned: ubuntu-latest put some jobs on a 26.04 image whose apt finds no luajit, clang or libfuse2)
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        timeout-minutes: 10
        with:
          pattern: gambit-*-*
          path: games-of-run
          run-id: ${{ inputs.report_run || github.run_id }}
          github-token: ${{ github.token }}
      # (THE GAMES A SLOW RUNNER SKIPPED, each played again at once as a run of its own named for this one: waited for -- a game played
      # again may itself be skipped and dispatched once more -- and their games read in beside this run's)
      - name: The skipped games, played again
        timeout-minutes: 60
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PARENT: ${{ inputs.report_run || github.run_id }}
        run: |
          title="Gambit 28, a game for $PARENT"
          since=$(gh api "repos/$REPO/actions/runs/$PARENT" --jq .created_at)
          kids() { gh api "repos/$REPO/actions/workflows/gambit-24.yml/runs?created=>=$since&per_page=100" --jq ".workflow_runs[] | select(.display_title == \"$title\") | \"\(.id) \(.status)\""; }
          calm=0
          while [ $calm -lt 2 ]; do
            k=$(kids || true); busy=$(printf '%s\n' "$k" | grep -c ' \(queued\|in_progress\|waiting\|requested\|pending\)$' || true)
            if [ "$busy" = 0 ]; then calm=$((calm + 1)); else calm=0; fi
            sleep 30
          done
          n=0; for id in $(printf '%s\n' "$k" | awk 'NF {print $1}'); do gh run download "$id" --repo "$REPO" --pattern 'gambit-*-*' --dir games-of-run && n=$((n + 1)) || true; done
          echo "::notice title=played again::$n skipped games read in from their own runs"
      - name: The run, written up
        timeout-minutes: 45
        run: |
          EV=games/the-game/ai/eval
          mkdir -p report
          node $EV/gambit_summary.js games-of-run > report/summary.txt 2>&1 || true
          node $EV/gambit_losses.js games-of-run 10 > report/losses.txt 2>&1 || true
          node $EV/gambit_reach.js games-of-run 300 3000 > report/reach.txt 2>&1 || true
          # (the time the run finished, ET on the 24-hour clock: plans/gambit-goal.md)
          echo "finished: $(TZ=America/New_York date '+%Y-%m-%d %H:%M') ET" >> report/summary.txt
          sed 's/^/::notice title=summary::/' report/summary.txt
          tail -3 report/losses.txt | sed 's/^/::notice title=losses::/'
          grep -h "boards searched again\|moves at the turn\|own time" report/reach.txt | sed 's/^/::notice title=reach::/' || true
          # (the reports whole, in the job's log: readable where the artifact is not)
          for f in summary losses reach; do echo "===== $f"; cat report/$f.txt; done
          { echo '## Gambit 28'; echo '```'; cat report/summary.txt; echo; tail -3 report/losses.txt; grep -h "boards searched again\|moves at the turn" report/reach.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 5
        with:
          name: gambit-report
          path: report/
          retention-days: 30
          overwrite: true   # (a run whose skipped games were played again is written up again: the last report is the run's)
      # THE TRUTH: every board the frame loop predicted is the one the game made (gambit_summary.js counts the games' own stats);
      # a run with any other is red
      - name: The truth held
        run: |
          grep -q '^truth: 0 ' report/summary.txt || { grep '^truth:' report/summary.txt | sed 's/^/::error title=truth::/'; exit 1; }
      # THE LINE AS JUDGED: every swap of a line handed on keyed from the frame the judge pressed it from, never later
      - name: The line pressed as judged
        run: |
          grep -q '^as judged: 0 ' report/summary.txt || { grep '^as judged:' report/summary.txt | sed 's/^/::error title=as judged::/'; exit 1; }
