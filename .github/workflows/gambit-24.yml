name: Gambit 24

# A Gambit profile plays all 24 training games in the real client's Training mode -- 8 each of combo_storm, factory and
# large_garbage, every game a job of its own, as training-mode.yml plays one pattern -- and a report job reads all 24 games'
# logs and writes the run up: games/the-game/ai/eval/gambit_summary.js (survived per mode, the frames lost at, combos and
# chains, the budgets), gambit_losses.js (the decisions before each loss), gambit_reach.js (was the break there; the turn).
# The summary is the run's notices; every report is the gambit-report artifact. With report_run, nothing is played: that run's games
# are written up again by this commit's reports.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'The Gambit profile, relative to games/the-game/ai/eval'
        default: 'survivor-profiles/gambit-finish.json'
      frames:
        description: 'A game survived this many frames counts as survived and ends (21600 = six minutes)'
        default: '21600'
      panel_ref:
        description: 'The panel-game commit or branch the games play on (default: the one real-time play was measured on before lockstep, with PA_DRAW_EVERY)'
        default: '4183b64dd73ecb3560c768a886c65e9ab2082bc4'
      report_run:
        description: 'A past run of this workflow: its games written up again, nothing played'
        default: ''
      workers:
        description: "Gambit's worker threads (GC_GAMBIT_WORKERS; none when empty): four -- the break search, the planner's second half and the chain, the survival search, the break search's wider beam"
        default: '4'
      bot:
        description: 'gambit (in the client, libgambit.so; needs a panel_ref with PA_BOT=gambit) or wasm (survivor.js beside it)'
        default: 'gambit'
      seed:
        description: 'The panel seed base (PA_SEED = base*100 + pattern*10 + game: every game the same panels every run); empty (the default) for random -- every run new games'
        default: ''
      patterns:
        description: 'The patterns played, a JSON list (one pattern worked on alone: its 8 games; the goal is measured on all three)'
        default: '["combo_storm","factory","large_garbage"]'
      gambit_from:
        description: 'A commit whose Gambit (games/the-game/ai/gambit) is played instead of this one, on these seeds and this harness -- a build before measured again on the same games; empty for this commit'
        default: ''
      rounds:
        description: "The rounds played, a JSON list: each round plays every pattern's 8 games again on seeds of its own (round r: seed base + r - 1), so a build is measured on more games than one run holds"
        default: '[1]'

permissions:
  contents: read
  actions: read

jobs:
  play:
    if: ${{ inputs.report_run == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        pattern: ${{ fromJSON(inputs.patterns || '["combo_storm","factory","large_garbage"]') }}
        game: [1, 2, 3, 4, 5, 6, 7, 8]
        round: ${{ fromJSON(inputs.rounds || '[1]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: ${{ inputs.gambit_from != '' && '0' || '1' }}
      - name: The Gambit of another commit
        if: ${{ inputs.gambit_from != '' }}
        env:
          GAMBIT_FROM: ${{ inputs.gambit_from }}
        run: |
          from=$(awk -v n="$GAMBIT_FROM" '$1 == n { print $2 }' games/the-game/ai/eval/gambit-versions.txt); from=${from:-$GAMBIT_FROM}
          rm -rf games/the-game/ai/gambit && git checkout "$from" -- games/the-game/ai/gambit
          echo "::notice title=gambit::the Gambit of ${{ inputs.gambit_from }}"
      - uses: actions/checkout@v4
        with:
          repository: briankeegan/panel-game
          ref: ${{ inputs.panel_ref || '4183b64dd73ecb3560c768a886c65e9ab2082bc4' }}
          path: panel-game
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: xvfb, love and clang
        timeout-minutes: 15
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120"
          for i in 1 2 3; do timeout 240 sudo apt-get $APT update && timeout 240 sudo apt-get $APT install -y libfuse2 xvfb clang luajit zlib1g-dev && break; sleep 10; done
          mkdir -p ~/love2d
          for i in 1 2 3; do curl -fsSL "https://github.com/panel-attack/panel-game/releases/download/love2d-12.0/love-12.0-linux-x86_64.tar.gz" -o /tmp/love.tar.gz && break; sleep 10; done
          tar -xzf /tmp/love.tar.gz -C ~/love2d
          mv ~/love2d/*.AppImage ~/love2d/love.AppImage
          chmod +x ~/love2d/love.AppImage
      - name: Gambit sees only what the screen shows
        timeout-minutes: 2
        run: luajit games/the-game/ai/gambit/lua/board.test.lua
      - name: Play
        timeout-minutes: 340
        env:
          PG: ${{ github.workspace }}/panel-game
          LOVE: /home/runner/love2d/love.AppImage
          OUT_DIR: ${{ github.workspace }}/out
          PROFILE: ${{ inputs.profile }}
          FRAMES: ${{ inputs.frames }}
          MINUTES: '60'
          GC_GAMBIT_WORKERS: ${{ inputs.workers }}
          SEED_BASE: ${{ inputs.seed }}
        run: |
          if [ -n "$SEED_BASE" ]; then
            case "${{ matrix.pattern }}" in combo_storm) P=1;; factory) P=2;; large_garbage) P=3;; *) P=9;; esac
            export PA_SEED=$(((SEED_BASE + ${{ matrix.round }} - 1) * 100 + P * 10 + ${{ matrix.game }}))
            echo "::notice title=seed::${{ matrix.pattern }} ${{ matrix.game }} round ${{ matrix.round }}: PA_SEED=$PA_SEED"
          fi
          echo "::notice title=cores::$(nproc) threads, $(lscpu | awk -F: '/^Core\(s\) per socket|^Thread\(s\) per core/ {gsub(/ +/, " ", $2); printf "%s:%s, ", $1, $2}')cpu:core $(lscpu -e=CPU,CORE | tail -n +2 | awk '{printf "%s:%s ", $1, $2}'), GC_GAMBIT_WORKERS=$GC_GAMBIT_WORKERS"
          bash games/the-game/ai/eval/training.sh "${{ inputs.bot || 'gambit' }}" "${{ matrix.pattern }}" 1
      - name: Results
        if: always()
        run: grep -h '^game ' out/results.txt 2>/dev/null | sed 's/^/::notice title=${{ matrix.pattern }} ${{ matrix.game }} r${{ matrix.round }}::/' || true
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 5
        with:
          name: gambit-${{ matrix.pattern }}-${{ matrix.game }}${{ matrix.round > 1 && format('-r{0}', matrix.round) || '' }}
          path: |
            out/results.txt
            out/survivor.log
          if-no-files-found: warn
          retention-days: 14

  # (the code's checks, once a run beside the games: a check that fails turns the run red without stopping a game)
  checks:
    if: ${{ inputs.report_run == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: ${{ inputs.gambit_from != '' && '0' || '1' }}
      - name: The Gambit of another commit
        if: ${{ inputs.gambit_from != '' }}
        env:
          GAMBIT_FROM: ${{ inputs.gambit_from }}
        run: |
          from=$(awk -v n="$GAMBIT_FROM" '$1 == n { print $2 }' games/the-game/ai/eval/gambit-versions.txt); from=${from:-$GAMBIT_FROM}
          rm -rf games/the-game/ai/gambit && git checkout "$from" -- games/the-game/ai/gambit
      - name: clang
        timeout-minutes: 10
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120"
          for i in 1 2 3; do timeout 240 sudo apt-get $APT update && timeout 240 sudo apt-get $APT install -y clang luajit zlib1g-dev && break; sleep 10; done
      - name: Gambit's C checks (the bits, perched blocks, the decisions replayed against the golden)
        timeout-minutes: 15
        # (and again on two workers: the readiness searched on every thread -- every check but the golden, which their search may move)
        run: cd games/the-game/ai/gambit && ./build.sh test && GC_GAMBIT_WORKERS=2 ./build.sh test && ./build.sh tsan > /dev/null

  report:
    needs: play
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        timeout-minutes: 10
        with:
          pattern: gambit-*-*
          path: games-of-run
          run-id: ${{ inputs.report_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: The run, written up
        timeout-minutes: 45
        run: |
          EV=games/the-game/ai/eval
          mkdir -p report
          node $EV/gambit_summary.js games-of-run > report/summary.txt 2>&1 || true
          node $EV/gambit_losses.js games-of-run 10 > report/losses.txt 2>&1 || true
          node $EV/gambit_reach.js games-of-run 300 3000 > report/reach.txt 2>&1 || true
          # (the time the run finished, ET on the 24-hour clock: plans/gambit-goal.md)
          echo "finished: $(TZ=America/New_York date '+%Y-%m-%d %H:%M') ET" >> report/summary.txt
          sed 's/^/::notice title=summary::/' report/summary.txt
          tail -3 report/losses.txt | sed 's/^/::notice title=losses::/'
          grep -h "boards searched again\|moves at the turn\|own time" report/reach.txt | sed 's/^/::notice title=reach::/' || true
          # (the reports whole, in the job's log: readable where the artifact is not)
          for f in summary losses reach; do echo "===== $f"; cat report/$f.txt; done
          { echo '## Gambit 24'; echo '```'; cat report/summary.txt; echo; tail -3 report/losses.txt; grep -h "boards searched again\|moves at the turn" report/reach.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 5
        with:
          name: gambit-report
          path: report/
          retention-days: 30
      # THE TRUTH: every board the frame loop predicted is the one the game made (gambit_summary.js counts the games' own stats);
      # a run with any other is red
      - name: The truth held
        run: |
          grep -q '^truth: 0 ' report/summary.txt || { grep '^truth:' report/summary.txt | sed 's/^/::error title=truth::/'; exit 1; }
      # THE LINE AS JUDGED: every swap of a line handed on keyed from the frame the judge pressed it from, never later
      - name: The line pressed as judged
        run: |
          grep -q '^as judged: 0 ' report/summary.txt || { grep '^as judged:' report/summary.txt | sed 's/^/::error title=as judged::/'; exit 1; }
