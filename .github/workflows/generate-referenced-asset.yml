name: Generate referenced asset

# Manually triggered only (workflow_dispatch) — same never-runs-on-push safety
# as the other generators. This is the ONLY one of the three image-gen Actions
# that actually uses reference images to guide the output — "Generate image"
# and "Generate game asset" are text-prompt-only (OpenAI's /v1/images/generations),
# which can describe a look but can't match a specific supplied picture. This
# calls OpenAI's /v1/images/edits instead, attaching one or more reference PNGs
# already committed in the repo (e.g. reference/<game>/inspo-07.png) so the
# output is actually visually derived from them, not just described in words.
#
# Use this over "Generate game asset" whenever a specific reference image
# exists for what you're generating (a character, a scene) and the ask is to
# match it closely. Falls back to games/<game>/art-style.json for palette/style
# framing the same way "Generate game asset" does, if that file exists.
on:
  workflow_dispatch:
    inputs:
      game:
        description: "Game id (used to look up games/<id>/art-style.json, optional)"
        required: false
        type: string
      asset:
        description: "What this image is / how it should differ from the references, e.g. 'Nella, the protagonist, red demon horns and glowing red eyes, dark crimson robe'"
        required: true
        type: string
      references:
        description: "Comma-separated repo-relative paths to reference PNGs, e.g. reference/the-game/inspo-07.png,reference/the-game/inspo-08.png"
        required: true
        type: string
      output_path:
        description: "Where to save it, e.g. games/the-game/art/kat.png"
        required: true
        type: string
      size:
        description: "Image size"
        required: false
        type: choice
        options:
          - "1024x1024"
          - "1024x1536"
          - "1536x1024"
        default: "1024x1024"
      quality:
        description: "Render quality — cost rises steeply: low < medium < high."
        required: false
        type: choice
        options:
          - "low"
          - "medium"
          - "high"
        default: "medium"
      transparent:
        description: "Cut the subject out on a transparent background (for a game sprite, not a scene/background)"
        required: false
        type: boolean
        default: false
      force:
        description: "Regenerate even if the output file already exists"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/validate-game-input
        with:
          game: ${{ inputs.game }}

      # MODEL COMES FROM THE SAME PLACE AS EVERY OTHER GENERATOR, EVEN THOUGH
      # THIS ENDPOINT IS DIFFERENT. /images/edits (multipart, reference-image
      # input) is not the JSON call imagegen.py's build_request() validates —
      # unifying the transport itself is real follow-up work, not done here,
      # and not worth guessing at with no key in this environment to test a
      # multipart call against. But the model string being retyped in a FOURTH
      # place is exactly the divergence that put two different generators'
      # art in one character sheet tonight, so at minimum that one value comes
      # from profiles.py rather than being hardcoded again.
      - name: Resolve model
        id: model
        run: |
          echo "model=$(python3 -c 'import sys; sys.path.insert(0,".github/art"); import profiles; print(profiles.MODEL)')" >> "$GITHUB_OUTPUT"

      - name: Build prompt (asset + optional art-style.json framing)
        id: style
        env:
          GAME: ${{ inputs.game }}
          ASSET: ${{ inputs.asset }}
        run: |
          STYLE_FILE="games/$GAME/art-style.json"
          if [ -n "$GAME" ] && [ -f "$STYLE_FILE" ]; then
            camera=$(jq -r '.camera' "$STYLE_FILE")
            style=$(jq -r '.style' "$STYLE_FILE")
            palette=$(jq -r '.palette' "$STYLE_FILE")
            background=$(jq -r '.background' "$STYLE_FILE")
            constraints=$(jq -r '.constraints' "$STYLE_FILE")
            prompt="Match the visual style of the attached reference image(s) closely (rendering technique, line work, lighting, palette). ${camera} ${ASSET}. ${style} Color palette: ${palette} Background: ${background} ${constraints}"
          else
            prompt="Match the visual style of the attached reference image(s) closely (rendering technique, line work, lighting, palette). ${ASSET}"
          fi
          {
            echo "prompt<<PROMPT_EOF"
            echo "$prompt"
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate image via OpenAI (reference-guided edit)
        id: gen
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROMPT: ${{ steps.style.outputs.prompt }}
          SIZE: ${{ inputs.size }}
          QUALITY: ${{ inputs.quality }}
          OUTPUT_PATH: ${{ inputs.output_path }}
          REFERENCES: ${{ inputs.references }}
          TRANSPARENT: ${{ inputs.transparent }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ -s "$OUTPUT_PATH" ] && [ "$FORCE" != "true" ]; then
            echo "::notice::$OUTPUT_PATH already exists — skipping (re-run with force=true to regenerate)."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$(dirname "$OUTPUT_PATH")"

          # NEVER PAY FOR THE SAME PICTURE TWICE. This Action curls
          # /v1/images/edits directly, because imagegen.py's JSON build_request
          # does not cover the multipart reference-image endpoint yet — so it
          # does not inherit the vault, and has to carry the rule by hand.
          # .github/scripts/check_generators.mjs requires exactly this of it by
          # name. See .github/art/GENERATOR_RULES.md §1-2.
          if [ "$FORCE" != "true" ]; then
            python3 .github/art/vault.py restore "$OUTPUT_PATH" || true
            if [ -s "$OUTPUT_PATH" ]; then
              echo "::notice::recovered $OUTPUT_PATH from the vault — nothing billed."
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          IFS=',' read -ra REF_ARR <<< "$REFERENCES"
          IMG_ARGS=()
          for ref in "${REF_ARR[@]}"; do
            ref_trimmed=$(echo "$ref" | xargs)
            [ -z "$ref_trimmed" ] && continue
            if [ ! -f "$ref_trimmed" ]; then
              echo "::error::Reference image not found: $ref_trimmed"
              exit 1
            fi
            IMG_ARGS+=(-F "image[]=@${ref_trimmed}")
          done
          if [ "${#IMG_ARGS[@]}" -eq 0 ]; then
            echo "::error::No valid reference images provided."
            exit 1
          fi

          BG_ARGS=()
          [ "$TRANSPARENT" = "true" ] && BG_ARGS=(-F "background=transparent")

          ok=""
          for attempt in 1 2 3 4 5 6; do
            resp=$(curl -sS -w '\n%{http_code}' https://api.openai.com/v1/images/edits \
              -H "Authorization: Bearer $OPENAI_API_KEY" \
              -F "model=${{ steps.model.outputs.model }}" \
              "${IMG_ARGS[@]}" \
              -F "prompt=${PROMPT}" \
              -F "size=${SIZE}" \
              -F "quality=${QUALITY}" \
              "${BG_ARGS[@]}" || true)
            code=$(printf '%s' "$resp" | tail -n1)
            body=$(printf '%s' "$resp" | sed '$d')
            if [ "$code" = "200" ]; then ok=1; break; fi
            error=$(printf '%s' "$body" | jq -r '.error.message // empty' 2>/dev/null)
            if [ "$code" = "429" ] || [ "$code" = "000" ] || [ "${code#5}" != "$code" ]; then
              wait=$((attempt * 15 + RANDOM % 8))
              echo "Rate-limited/transient (HTTP $code, attempt $attempt): ${error:-no body} — retrying in ${wait}s"
              sleep "$wait"
              continue
            fi
            echo "::error::OpenAI API error (HTTP $code): ${error:-unknown}"
            exit 1
          done
          if [ -z "$ok" ]; then
            echo "::error::Still rate-limited after retries — try again later."
            exit 1
          fi

          printf '%s' "$body" | jq -r '.data[0].b64_json' | base64 -d > "$OUTPUT_PATH"

          # SAVE IT NOW, before any step that can fail. The picture is billed
          # the moment the API returns it; everything after is free to redo,
          # but only if the picture still exists.
          [ -s "$OUTPUT_PATH" ] && python3 .github/art/vault.py save "$OUTPUT_PATH" || true
          if [ ! -s "$OUTPUT_PATH" ]; then
            echo "::error::Output file is empty — generation likely failed"
            exit 1
          fi

      - name: Resize + trim for web
        if: steps.gen.outputs.skipped != 'true'
        timeout-minutes: 5
        env:
          OUTPUT_PATH: ${{ inputs.output_path }}
        run: |
          # See generate-game-asset.yml for why this no longer uses apt-get:
          # `apt-get install imagemagick` was confirmed to hang SILENTLY for a
          # full 10-minute step timeout with zero output — not slow, actually
          # stuck — so no retry/timeout tuning around apt-get itself could fix
          # it. Pillow installs from PyPI instead and does the same job.
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 - <<'PYEOF'
          import os
          from PIL import Image
          path = os.environ["OUTPUT_PATH"]
          im = Image.open(path).convert("RGBA")
          bbox = im.getbbox()
          if bbox:
              im = im.crop(bbox)
          im.thumbnail((768, 768), Image.LANCZOS)
          im.save(path)
          PYEOF

      - name: Commit and push
        if: steps.gen.outputs.skipped != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # BUMP THE PWA CACHE VERSION. Committing new art into a game's tree
          # with no cache-name change means the service worker keeps serving
          # the OLD file forever — the exact "the art never changed" bug this
          # repo already paid to learn, now via a door that never got the fix.
          # Same one-liner clubhouse-autopilot.yml's landing step uses.
          GAME="${{ inputs.game }}"
          SW="games/$GAME/sw.js"
          if [ -f "$SW" ] && perl -i -pe 's/(GCRegisterServiceWorker\("[^"]*?-v)(\d+)(")/$1 . ($2 + 1) . $3/e' "$SW" && ! git diff --quiet -- "$SW"; then
            git add "$SW"
            echo "Bumped PWA cache version in $SW"
          fi
          node .github/autopilot/sync-precache.js --fix >/dev/null 2>&1 || true
          git add "${{ inputs.output_path }}"
          git commit -m "Generate referenced asset (${{ inputs.game }}): ${{ inputs.asset }}" || { echo "Nothing to commit"; exit 0; }
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push && exit 0
            echo "push race, retrying ($i)…"; sleep $((RANDOM % 6 + 2))
          done
          echo "::error::Could not push after retries"; exit 1
