name: Generate game asset

# Manually triggered only (workflow_dispatch) — same never-runs-on-push
# safety as "Generate image". Use THIS action (not "Generate image") when
# the asset needs to match a game's established look. It reads
# games/<game>/art-style.json and locks in that game's camera angle,
# rendering style, palette, and background treatment on every call —
# `asset` only has to describe what's different about this one image
# (subject, pose, ship type, etc). That's what keeps a whole set of
# sprites/icons for one game visually consistent instead of depending on
# how thorough one prompt happened to be that day.
#
# Use "Generate image" instead for one-off / experimental images that
# aren't part of a game's established set, or before a game has an
# art-style.json yet.
on:
  workflow_dispatch:
    inputs:
      game:
        description: "Game id — must have games/<id>/art-style.json"
        required: true
        type: string
      asset:
        description: "What THIS image is, e.g. 'top-down enemy interceptor ship, small and nimble'"
        required: true
        type: string
      output_path:
        description: "Where to save it in the repo, e.g. games/hypergolic-hull/icons/enemy-interceptor.png"
        required: true
        type: string

      force:
        description: "Regenerate (and re-bill) even if the output file already exists. Off by default so re-running a batch never pays twice."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # A room background is NOT a game asset you can ask for here. Rooms are
      # three passes (docs/ROOM_ART_STANDARD.md) and go through the "Generate
      # room pass" Action, which is a button on .github/art/room.py. Asking
      # this Action for one produces the OLD kind of room — scenery painted
      # into the background — which silently invalidates that room's walk mask
      # and every collision number measured against the picture it replaced.
      #
      # This guard exists because that is exactly what happened: bg-lounge.png
      # was regenerated through here, landed, and nothing objected until a
      # human noticed the room was broken.
      - name: Refuse room backgrounds
        env:
          OUTPUT_PATH: ${{ inputs.output_path }}
        run: |
          case "$OUTPUT_PATH" in
            */art/bg-*.png)
              echo "::error::$OUTPUT_PATH is a ROOM BACKGROUND."
              echo "Rooms are generated in three passes — use the 'Generate room pass'"
              echo "Action (game, room, pass=scene|plate|props), or run"
              echo "  python3 .github/art/room.py generate <game> <room> <pass>"
              echo "See docs/ROOM_ART_STANDARD.md and .github/art/README.md."
              exit 1;;
          esac

      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/validate-game-input
        with:
          game: ${{ inputs.game }}

      # Combines the game's fixed style (camera/style/palette/background/
      # constraints from art-style.json) with the per-image `asset`
      # description into one prompt. Written to GITHUB_OUTPUT via a
      # heredoc so it survives being multi-line / containing quotes.
      - name: Build styled prompt
        id: style
        env:
          GAME: ${{ inputs.game }}
          ASSET: ${{ inputs.asset }}
        run: |
          STYLE_FILE="games/$GAME/art-style.json"
          if [ ! -f "$STYLE_FILE" ]; then
            echo "::error::No art-style.json found at $STYLE_FILE — create one first (see CLAUDE.md), or use the 'Generate image' action instead for a one-off."
            exit 1
          fi

          camera=$(jq -r '.camera' "$STYLE_FILE")
          style=$(jq -r '.style' "$STYLE_FILE")
          palette=$(jq -r '.palette' "$STYLE_FILE")
          background=$(jq -r '.background' "$STYLE_FILE")
          constraints=$(jq -r '.constraints' "$STYLE_FILE")

          prompt="${camera} ${ASSET}. ${style} Color palette: ${palette} Background: ${background} ${constraints}"

          {
            echo "prompt<<PROMPT_EOF"
            echo "$prompt"
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      # THE SAME TRANSPORT EVERY OTHER GENERATOR USES — see "Generate image"
      # for why. background is always transparent here specifically (game
      # assets need to drop onto the UI as sprites, not framed rectangles);
      # imagegen.py validates that combination against output_format before
      # anything is billed, which the old hand-rolled call never checked.
      - name: Generate image
        id: gen
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROMPT: ${{ steps.style.outputs.prompt }}
        run: |
          if [ -s "${{ inputs.output_path }}" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "::notice::${{ inputs.output_path }} already exists — skipping (re-run with force=true to regenerate)."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$(dirname '${{ inputs.output_path }}')"
          python3 .github/art/imagegen.py \
            --kind icon \
            --prompt "$PROMPT" \
            --output "${{ inputs.output_path }}" \
            --force

      # Downscale to a web-friendly sprite size so a set of assets doesn't
      # bloat the PWA (a raw 1024px PNG is ~1.5MB; 512px trimmed is ~10x
      # smaller). -trim removes fully-transparent margins so the subject
      # fills the frame consistently. ImageMagick is NOT preinstalled on
      # ubuntu-latest (confirmed via a failed run: "convert: command not
      # found") so it's installed explicitly first.
      - name: Resize + trim for web
        if: steps.gen.outputs.skipped != 'true'
        timeout-minutes: 5
        env:
          OUTPUT_PATH: ${{ inputs.output_path }}
        run: |
          # apt-get install imagemagick previously hung SILENTLY for the full
          # step timeout against a busy/unreachable mirror (confirmed: a run
          # produced zero output for 10 straight minutes before timing out) —
          # not just slow, actually stuck, so no amount of retry/timeout
          # tuning around apt-get itself would help. Pillow is pure-Python,
          # installs from PyPI (a different, more reliable host) in seconds,
          # and does the same trim+resize+pad job.
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 - <<'PYEOF'
          import os
          from PIL import Image
          path = os.environ["OUTPUT_PATH"]
          im = Image.open(path).convert("RGBA")
          bbox = im.getbbox()
          if bbox:
              im = im.crop(bbox)
          im.thumbnail((512, 512), Image.LANCZOS)
          im.save(path)
          PYEOF

      # Retry-with-rebase so several asset generations running at once don't
      # clobber each other pushing to main (each runner does plain commit+push).
      - name: Commit and push
        if: steps.gen.outputs.skipped != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # BUMP THE PWA CACHE VERSION. Committing new art into a game's tree
          # with no cache-name change means the service worker keeps serving
          # the OLD file forever — the exact "the art never changed" bug this
          # repo already paid to learn, now via a door that never got the fix.
          # Same one-liner clubhouse-autopilot.yml's landing step uses.
          GAME="${{ inputs.game }}"
          SW="games/$GAME/sw.js"
          if [ -f "$SW" ] && perl -i -pe 's/(GCRegisterServiceWorker\("[^"]*?-v)(\d+)(")/$1 . ($2 + 1) . $3/e' "$SW" && ! git diff --quiet -- "$SW"; then
            git add "$SW"
            echo "Bumped PWA cache version in $SW"
          fi
          node .github/autopilot/sync-precache.js --fix >/dev/null 2>&1 || true
          git add "${{ inputs.output_path }}"
          git commit -m "Generate game asset (${{ inputs.game }}): ${{ inputs.asset }}" || { echo "Nothing to commit"; exit 0; }
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push && exit 0
            echo "push race, retrying ($i)…"; sleep $((RANDOM % 6 + 2))
          done
          echo "::error::Could not push after retries"; exit 1
