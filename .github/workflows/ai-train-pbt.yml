# THE PUYO LOOP ON EVERY CORE.
#
# ai-train-versus.yml runs train_versus.js: one duel at a time, so one of the
# runner's four cores works and three idle. train_pbt.js forks one ISLAND per
# core — separate populations running the same loop, each with its own RNG
# seed — and between legs the islands' champions duel each other directly. An
# island whose champion loses replaces its worst vector with the winner's
# weights, jogged.
#
# SEPARATE WORKFLOW, NOT AN INPUT ON ai-train-versus.yml, for the same reason
# that one is separate from ai-train.yml: different state on disk, different
# snapshot names, and the two have to be able to run at once — a single-island
# loop is the only baseline an island run can be read against.
#
# IT DOES NOT RESUME. Island state lives in .pbt-<seed>/, which is gitignored
# and dies with the container. A run is one search from random weights; it
# does not continue the last one.
name: Train the AI head-to-head (islands)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Label for this experiment, used in the snapshot filenames'
        default: ''
      level:
        description: 'Game level to train at'
        default: '10'
      exclude:
        description: 'Features to leave OUT of the genome (comma list, blank = all)'
        default: ''
      islands:
        description: 'Islands, one per core. The runner has 4'
        default: '4'
      population:
        description: 'Weight vectors held PER ISLAND. Puyo uses 16'
        default: '16'
      leg:
        description: 'Updates each island runs before the champions face off'
        default: '250'
      faceoff:
        description: 'Seeds per champion pairing in the face-off'
        default: '3'
      ga_seed:
        description: 'RNG seed. CHANGE IT for an independent run of the same config'
        default: '11'
      depth:
        description: 'Lookahead depth. 1 = greedy, 2 = beam search'
        default: '1'
      beam:
        description: 'Candidates expanded at depth > 1. 0 = all of them'
        default: '0'
      rise:
        description: 'Rise-adjusted scoring (1 = on)'
        default: '1'
      density:
        description: 'Density scoring: counts made of panels become per-panel (1 = on)'
        default: ''

# One run per experiment, and never two of the same. cancel-in-progress stays
# FALSE — a run that has done four hours of updates has earned them.
concurrency:
  group: ai-train-pbt-${{ github.event.inputs.variant || 'default' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  islands:
    runs-on: ubuntu-latest
    # Under the 6-hour hard cap, so the job's own timeout never stops it —
    # train_pbt.js stops first, on GC_DEADLINE, between legs, with the leg's
    # snapshot already written and pushed.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # It commits a snapshot as it earns one, so real credentials and
          # full history, not a shallow clone.
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: briankeegan/panel-game
          path: panel-game
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Who is committing
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Seconds against hours. versus_loop.test.js is the one that matters —
      # it checks the update rule in BOTH train_versus.js and pbt_worker.js,
      # which is the whole algorithm.
      - name: Check the harness before spending five hours on it
        working-directory: games/the-game/ai/eval
        timeout-minutes: 30
        env:
          GC_TRAINING_DIR: ${{ github.workspace }}/panel-game/client/assets/default_data/training
        run: |
          node versus.test.js
          node versus_loop.test.js
          node features.test.js
          node puyocpu.test.js

      - name: Islands
        working-directory: games/the-game/ai/eval
        env:
          GC_TRAINING_DIR: ${{ github.workspace }}/panel-game/client/assets/default_data/training
          GC_LEVEL: ${{ github.event.inputs.level || '10' }}
          GC_EXCLUDE: ${{ github.event.inputs.exclude || '' }}
          GC_VARIANT: ${{ github.event.inputs.variant || '' }}
          GC_GA_SEED: ${{ github.event.inputs.ga_seed || '11' }}
          GC_DEPTH: ${{ github.event.inputs.depth || '1' }}
          GC_BEAM: ${{ github.event.inputs.beam || '0' }}
          GC_RISE: ${{ github.event.inputs.rise || '1' }}
          GC_DENSITY: ${{ github.event.inputs.density || '' }}
          GC_PBT_ISLANDS: ${{ github.event.inputs.islands || '4' }}
          GC_PBT_LEG: ${{ github.event.inputs.leg || '250' }}
          GC_PBT_FACEOFF: ${{ github.event.inputs.faceoff || '3' }}
          GC_VS_POPULATION: ${{ github.event.inputs.population || '16' }}
          GC_MODE: pbt
          GC_TAG: pbt-${{ github.event.inputs.variant || 'default' }}-s${{ github.event.inputs.ga_seed || '11' }}
          # commit_snapshot.sh calls anything under this a smoke run and
          # refuses to commit it. A real island holds 16 vectors; a smoke run
          # holds fewer, and is still rejected.
          GC_MIN_POP: '16'
          GC_SNAPSHOT_HOOK: ${{ github.workspace }}/games/the-game/ai/eval/commit_snapshot.sh
        run: |
          # 315 minutes, not 340. The deadline is only read BETWEEN legs, and
          # a leg is about 20 minutes, so the margin has to be a whole leg or
          # the last one starts too late and the job's 350 kills it mid-duel.
          export GC_DEADLINE=$(( $(date +%s) + 315 * 60 ))
          node train_pbt.js
