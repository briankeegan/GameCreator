# THE PUYO LOOP ON EVERY CORE.
#
# ai-train-versus.yml runs train_versus.js: one duel at a time, so one of the
# runner's four cores works and three idle. train_pbt.js forks one ISLAND per
# core — separate populations running the same loop, each with its own RNG
# seed — and between legs the islands' champions duel each other directly. An
# island whose champion loses replaces its worst vector with the winner's
# weights, jogged.
#
# SEPARATE WORKFLOW, NOT AN INPUT ON ai-train-versus.yml, for the same reason
# that one is separate from ai-train.yml: different state on disk, different
# snapshot names, and the two have to be able to run at once — a single-island
# loop is the only baseline an island run can be read against.
#
# IT RESUMES. Island state lives in .pbt-<seed>/, gitignored but force-added by
# commit_snapshot.sh alongside each champion, and each file carries a hash of
# the configuration — so a continuation opens the same populations and a run
# with different inputs starts its own.
name: Train the AI head-to-head (islands)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Label for this experiment, used in the snapshot filenames'
        default: ''
      level:
        description: 'Game level to train at'
        default: '10'
      exclude:
        description: 'Features to leave OUT of the genome (comma list, blank = all)'
        default: ''
      islands:
        description: 'Islands, one per core. The runner has 4'
        default: '4'
      population:
        description: 'Weight vectors held PER ISLAND. Puyo uses 16'
        default: '16'
      leg:
        description: 'Updates each island runs before the champions face off'
        default: '250'
      faceoff:
        description: 'Seeds per champion pairing in the face-off'
        default: '3'
      ga_seed:
        description: 'RNG seed. CHANGE IT for an independent run of the same config'
        default: '11'
      depth:
        description: 'Lookahead depth. 1 = greedy, 2 = beam search'
        default: '1'
      beam:
        description: 'Candidates expanded at depth > 1. 0 = all of them'
        default: '0'
      rise:
        description: 'Rise-adjusted scoring (1 = on)'
        default: '1'
      density:
        description: 'Density scoring: counts made of panels become per-panel (1 = on)'
        default: ''
      migrate:
        description: '0 = four INDEPENDENT loops, no weights carried between islands. The control'
        default: '1'
      minutes:
        description: 'Minutes to train before stopping with a snapshot written. Under the job timeout'
        default: '315'
      chain:
        description: 'false = run one leg and stop. Otherwise the leg dispatches its own continuation'
        default: 'true'


# One run per experiment, and never two of the same. cancel-in-progress stays
# FALSE — a run that has done four hours of updates has earned them.
concurrency:
  group: ai-train-pbt-${{ github.event.inputs.variant || 'default' }}
  cancel-in-progress: false

permissions:
  contents: write
  # ...and to dispatch its own continuation.
  actions: write

jobs:
  islands:
    runs-on: ubuntu-latest
    # Under the 6-hour hard cap, so the job's own timeout never stops it —
    # train_pbt.js stops first, on GC_DEADLINE, between legs, with the leg's
    # snapshot already written and pushed.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # It commits a snapshot as it earns one, so real credentials and
          # full history, not a shallow clone.
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: briankeegan/panel-game
          path: panel-game
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Who is committing
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Seconds against hours. versus_loop.test.js is the one that matters —
      # it checks the update rule in BOTH train_versus.js and pbt_worker.js,
      # which is the whole algorithm.
      - name: Check the harness before spending five hours on it
        working-directory: games/the-game/ai/eval
        timeout-minutes: 30
        env:
          GC_TRAINING_DIR: ${{ github.workspace }}/panel-game/client/assets/default_data/training
        run: |
          node versus.test.js
          node versus_loop.test.js
          node features.test.js
          node puyocpu.test.js
          node snapshot_pipe.test.js

      - name: Islands
        id: train
        working-directory: games/the-game/ai/eval
        env:
          GC_TRAINING_DIR: ${{ github.workspace }}/panel-game/client/assets/default_data/training
          GC_LEVEL: ${{ github.event.inputs.level || '10' }}
          GC_EXCLUDE: ${{ github.event.inputs.exclude || '' }}
          GC_VARIANT: ${{ github.event.inputs.variant || '' }}
          GC_GA_SEED: ${{ github.event.inputs.ga_seed || '11' }}
          GC_DEPTH: ${{ github.event.inputs.depth || '1' }}
          GC_BEAM: ${{ github.event.inputs.beam || '0' }}
          GC_RISE: ${{ github.event.inputs.rise || '1' }}
          GC_DENSITY: ${{ github.event.inputs.density || '' }}
          GC_PBT_ISLANDS: ${{ github.event.inputs.islands || '4' }}
          GC_PBT_LEG: ${{ github.event.inputs.leg || '250' }}
          GC_PBT_FACEOFF: ${{ github.event.inputs.faceoff || '3' }}
          GC_PBT_MIGRATE: ${{ github.event.inputs.migrate || '1' }}
          GC_VS_POPULATION: ${{ github.event.inputs.population || '16' }}
          GC_MODE: pbt
          GC_TAG: pbt-${{ github.event.inputs.variant || 'default' }}-s${{ github.event.inputs.ga_seed || '11' }}
          # commit_snapshot.sh calls anything under this a smoke run and
          # refuses to commit it. A real island holds 16 vectors; a smoke run
          # holds fewer, and is still rejected.
          GC_MIN_POP: '16'
          GC_SNAPSHOT_HOOK: ${{ github.workspace }}/games/the-game/ai/eval/commit_snapshot.sh
        run: |
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
          # Under the job's timeout, and under the platform's 360, so the run
          # stops itself with a snapshot written rather than being killed
          # mid-duel. The islands only read the deadline BETWEEN legs, so the
          # margin has to be a whole leg wide.
          export GC_DEADLINE=$(( $(date +%s) + ${{ github.event.inputs.minutes || '315' }} * 60 ))
          node train_pbt.js

      # See the header. A clean deadline stop, and nothing asking it to halt.
      - name: Dispatch the next leg
        if: github.event.inputs.chain != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINUTES: ${{ github.event.inputs.minutes || '315' }}
          STARTED: ${{ steps.train.outputs.started }}
        run: |
          set -eu
          elapsed=$(( $(date +%s) - STARTED ))
          floor=$(( MINUTES * 30 ))
          if [ "$elapsed" -lt "$floor" ]; then
            echo "trained for ${elapsed}s of a ${MINUTES}-minute leg — stopping rather than"
            echo "restarting something that is exiting early."
            exit 0
          fi
          git fetch -q origin main
          if git cat-file -e origin/main:games/the-game/ai/eval/STOP_TRAINING 2>/dev/null; then
            echo "STOP_TRAINING is on main — not continuing."
            exit 0
          fi
          # The continuation carries THIS run's inputs, so the chain cannot
          # drift into a different search: the population's fingerprint would
          # not match and it would silently start over.
          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ai-train-pbt.yml/dispatches" \
            -d '{"ref":"main","inputs":{"variant":"${{ github.event.inputs.variant }}","level":"${{ github.event.inputs.level }}","exclude":"${{ github.event.inputs.exclude }}","islands":"${{ github.event.inputs.islands }}","population":"${{ github.event.inputs.population }}","leg":"${{ github.event.inputs.leg }}","faceoff":"${{ github.event.inputs.faceoff }}","migrate":"${{ github.event.inputs.migrate }}","ga_seed":"${{ github.event.inputs.ga_seed }}","depth":"${{ github.event.inputs.depth }}","beam":"${{ github.event.inputs.beam }}","rise":"${{ github.event.inputs.rise }}","density":"${{ github.event.inputs.density }}","minutes":"${{ github.event.inputs.minutes }}","chain":"true"}}')
          if [ "$code" != "204" ]; then
            echo "the continuation was REFUSED (HTTP $code) — this chain ends here:"
            cat /tmp/dispatch.out
            exit 1
          fi
          echo "next leg dispatched"
