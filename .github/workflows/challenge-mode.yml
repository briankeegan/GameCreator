name: Challenge mode (the real client)

# A bot plays the panel-game client's own Challenge Mode, the game as a player
# runs it: games/the-game/ai/eval/challenge.sh (the menus clicked through by the
# client's e2e harness, the player's keys from the bot). Stage after stage
# until the recap, or past `continues` continues. Each stage's result is an
# annotation; the harness's log, the bot's and the client's are the artifact. While it plays, the harness's log is pushed every 20 s to the
# challenge-live branch as <run id>.txt, so a game in progress can be read.
on:
  workflow_dispatch:
    inputs:
      bot:
        description: 'wasm (WasmSurvivor) or bitbot (BitBot)'
        default: 'wasm'
      difficulty:
        description: 'Challenge difficulty, 1-8 (8 = Hurricane)'
        default: '8'
      profile:
        description: 'With bot wasm: the WasmSurvivor profile, relative to games/the-game/ai/eval (empty = survivor.profile.json)'
        default: 'survivor-profiles/isl2b4.json'
      stage:
        description: 'Start on this stage (empty = 1)'
        default: ''
      repeat:
        description: 'With stage: play it this many times, won or lost (empty = go on to the next)'
        default: ''
      continues:
        description: 'Stop after this many continues'
        default: '10'
      panel_ref:
        description: 'The panel-game branch with AppDriver PA_SURVIVOR and challengeloop'
        default: 'claude/newsey-game-ask-qa8u5e'

permissions:
  contents: write

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          repository: briankeegan/panel-game
          ref: ${{ inputs.panel_ref || 'claude/newsey-game-ask-qa8u5e' }}
          path: panel-game
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: xvfb, love and clang
        timeout-minutes: 15
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120"
          for i in 1 2 3; do timeout 240 sudo apt-get $APT update && timeout 240 sudo apt-get $APT install -y libfuse2 xvfb clang && break; sleep 10; done
          mkdir -p ~/love2d
          for i in 1 2 3; do curl -fsSL "https://github.com/panel-attack/panel-game/releases/download/love2d-12.0/love-12.0-linux-x86_64.tar.gz" -o /tmp/love.tar.gz && break; sleep 10; done
          tar -xzf /tmp/love.tar.gz -C ~/love2d
          mv ~/love2d/*.AppImage ~/love2d/love.AppImage
          chmod +x ~/love2d/love.AppImage
      - name: The live log's branch
        timeout-minutes: 3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin challenge-live; then git worktree add -q -B challenge-live live origin/challenge-live
          else git worktree add -q --detach live && git -C live checkout -q --orphan challenge-live && git -C live rm -rfq . ; fi
      - name: Play
        timeout-minutes: 340
        env:
          PG: ${{ github.workspace }}/panel-game
          LOVE: /home/runner/love2d/love.AppImage
          OUT_DIR: ${{ github.workspace }}/out
          PROFILE: ${{ inputs.profile }}
          STAGE: ${{ inputs.stage }}
          REPEAT: ${{ inputs.repeat }}
          MINUTES: '330'
        run: |
          set -u
          bash games/the-game/ai/eval/challenge.sh "${{ inputs.bot || 'wasm' }}" "${{ inputs.difficulty || '8' }}" "${{ inputs.continues || '10' }}" &
          RUN=$!
          LIVE="$GITHUB_WORKSPACE/live" NAME="${{ github.run_id }}.txt"
          live() {   # the harness's log so far, to the challenge-live branch
            cp "$OUT_DIR/pa_out.txt" "$LIVE/$NAME" 2>/dev/null || return 0
            git -C "$LIVE" add "$NAME" && git -C "$LIVE" commit -qm "challenge ${{ github.run_id }}" 2>/dev/null || return 0
            for i in 1 2 3; do git -C "$LIVE" push -q origin HEAD:challenge-live 2>/dev/null && return 0; git -C "$LIVE" pull -q --rebase origin challenge-live 2>/dev/null; done
          }
          while kill -0 $RUN 2>/dev/null; do sleep 20; live; done
          wait $RUN; rc=$?; live; exit $rc
      - name: Results
        if: always()
        run: |
          grep -h '^stage \|^challenge \|^texts\|TIMEOUT\|not in\|no menu\|did not\|never' out/pa_out.txt 2>/dev/null | sed 's/^/::notice title=challenge::/' || true
          grep -h 'match over' out/survivor.log 2>/dev/null | sed 's/^/::notice title=survivor::/' || true
          echo '## Challenge mode' >> "$GITHUB_STEP_SUMMARY"
          grep -h '^stage \|^challenge ' out/pa_out.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo 'no stage finished' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: challenge-mode
          path: out/
          if-no-files-found: warn
