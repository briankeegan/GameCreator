name: AI checks

# THE GATE FOR games/the-game/ai/. Everything in there was previously run
# by hand and only when somebody remembered, which this repo has already
# established is not a gate at all (CLAUDE.md: "A GATE THAT ONLY RUNS WHEN
# SOMEBODY REMEMBERS IS NOT A GATE" — every door defect that session was
# found by the owner playing the game, while the checks that would have
# caught them sat in the repo unrun).
#
# ai/experiments/harness_fidelity.test.js says so in its own header: it is
# the gate for two engine behaviours a harness got wrong twice, silently,
# invalidating every benchmark beside it — and it asks to be wired into CI
# "if/when this directory's tooling gets one". This is that.
#
# SEPARATE FROM pages.yml ON PURPOSE, the same split browser-checks.yml and
# art-checks.yml already use: pages.yml builds ONE artifact for every game,
# so a failure here would take the whole site down over one game's AI. The
# site always ships; this goes red on its own commit instead.
#
# But it MUST be able to go red. Every step below is a plain `node x.test.js`
# whose exit code is the verdict — no `|| true`, no appending a verdict to a
# file some later step prints as a warning. That pattern is what made every
# art check in this repo unable to fail while looking exactly like it could.
on:
  push:
    paths:
      - 'games/the-game/ai/**'
      - 'games/the-game/panel-engine.js'
      - 'games/the-game/panel-cpu.js'
      - '.github/workflows/ai-checks.yml'
  pull_request:
    paths:
      - 'games/the-game/ai/**'
      - 'games/the-game/panel-engine.js'
      - 'games/the-game/panel-cpu.js'
  workflow_dispatch:

jobs:
  evaluator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Does each feature compute what registry.js says it measures? Hand-built
      # boards, answers known by eye, asserting BOTH that a feature fires on
      # the thing it exists for and stays quiet on the near-miss.
      - name: Feature unit tests
        run: node games/the-game/ai/eval/features.test.js

      # Does the input agree with the REAL engine? A feature reading a field
      # that is always 0 produces perfectly plausible numbers and tunes into
      # nonsense, so fromStack is compared field by field against a live
      # Stack, the match rule is swept against getMatchingPanels over 7 seeds
      # and 6 colour counts, and framesToDeath is checked by actually killing
      # a board and timing it.
      - name: Evaluator/engine fidelity
        run: node games/the-game/ai/eval/input.fidelity.test.js

      # Does the adapter actually FEED every feature? The two suites above
      # are structurally blind to this — one builds inputs by hand, the other
      # checks fromStack — so a seam passing nothing would leave both green
      # while every weighted feature read zero in the only place that ships.
      - name: Seam reaches every feature
        run: node games/the-game/ai/eval/seam.test.js

      # Does the chain-potential feature agree with actually playing every
      # swap? It is checked against a brute-force implementation rather than
      # against its own logic, because a feature that only agrees with
      # itself is checked against nothing.
      - name: Chain potential
        run: node games/the-game/ai/eval/chainpotential.test.js

      # IS THE TRAINER PLAYING THE GAME THE BENCHMARK REPORTS? The GA's
      # drills must be full_report.js's drills frame for frame, because a
      # fitness that has drifted from the benchmark is a different question
      # answered confidently. Two rounds already ranked in opposite orders
      # on bench's invented drill and on endless. Exact equality, since the
      # last divergence was 12 frames out of 1329 from a shadowed constant.
      - name: Trainer drills match the benchmark
        run: node games/the-game/ai/eval/bench.fidelity.test.js

      # DOES THE CURSOR STILL WALK? stack.touchSwap queues a swap anywhere
      # on the board and teleports the cursor there in one frame, and the
      # cpu used to call it for every decision — so distance cost nothing,
      # a travel feature was trained against a cost the game never charged,
      # and none of it was visible in play or in the benchmark. One call to
      # touchSwap anywhere in panel-cpu.js brings that straight back, which
      # is why this runs on every push rather than when someone remembers.
      - name: The cursor never teleports
        run: node games/the-game/ai/eval/walk.test.js

      # Does the cursor-travel cost match the engine? travel.js prices what
      # the cpu pays, and this pins the formula to the cpu's OWN walks
      # rather than to a re-implementation of them — the first version of
      # the formula was off by one while looking perfectly reasonable.
      - name: Cursor travel cost
        run: node games/the-game/ai/eval/travel.test.js

      # Are the numbers right FOR THE BOARD BEING RANKED? Every other suite
      # either builds the board by hand or checks a single call, so a stale
      # board or a wrong candidate passes all of them. This intercepts real
      # evaluations mid-game and recomputes each feature with a second,
      # deliberately naive implementation.
      - name: Live-value oracle
        run: node games/the-game/ai/eval/oracle.test.js

      # THE ONE THAT PLAYS THE GAME. The three suites above can all be green
      # while the evaluator does nothing: one scores hand-built inputs, one
      # compares fromStack to a Stack, one checks single calls to patched
      # methods. None of them plays a frame, and every wiring defect this
      # directory has had was invisible until something played 900 —
      # scoring attached to a benchmark that never called it, inverted
      # scoring producing byte-identical play, Infinity making every
      # candidate tie, and a seam that at zero weights threw the shipped
      # choice away. Slow (a few minutes, dozens of real games) and worth
      # every second of it.
      - name: Wiring laws (plays the real game)
        run: node games/the-game/ai/eval/wiring.test.js

      # The experiments harness's own gate, which has been asking for a CI
      # home in its header comment since it was written.
      - name: Experiment harness fidelity
        run: node games/the-game/ai/experiments/harness_fidelity.test.js

      - name: Love RNG parity
        run: node games/the-game/ai/experiments/love_rng.test.js

      # Not AI, but the same shape of check with no home: it pins the ONE
      # SCALE PER CHARACTER rule that stopped sprites changing size mid-walk.
      - name: Sprite draw scale
        run: node games/the-game/sprite-scale.test.mjs
