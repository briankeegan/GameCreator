name: Generate character walk sheet

# ONE DISPATCH PER CHARACTER. Before this existed, giving a new character
# real walk animation meant three manual steps done in the right order:
# hand-copy the recipe prompt out of games/the-game/WALK_SHEETS.md, fill in
# the description, run "Generate image" (or "Generate referenced asset") with
# the right size, then check out the result and run
# .github/art/slice_walksheet.py by hand to cut the grid into frames. Every
# one of those was a place to drift — a reworded prompt, a forgotten column
# convention, a sheet that never got sliced.
#
# This does all three from one form: build the canonical prompt, generate,
# slice, commit. The prompt lives in .github/art/walksheet_prompt.txt so the
# recipe has exactly ONE copy; edit it there and every future character
# inherits the fix.
#
# What comes out: games/<game>/art/<id>_<dir>_<0|1|2>.png for down, left and
# up (RIGHT is not generated — the game mirrors LEFT with scale(-1,1)), plus
# the raw sheet kept alongside as <id>_walksheet.png for reference.
#
# Wiring the frames into the game is still a code change (add the character to
# that game's facing-frames table) — this Action only produces the art.
on:
  workflow_dispatch:
    inputs:
      game:
        description: "Game id, e.g. the-game"
        required: true
        type: string
      character_id:
        description: "Art id for the character, e.g. nella_human — frames are written as <id>_<dir>_<n>.png"
        required: true
        type: string
      description:
        description: "Who the character is: build, hair, clothing, colours, distinguishing features"
        required: true
        type: string
      references:
        description: "Optional comma-separated repo-relative reference PNGs to match likeness (e.g. games/the-game/art/nella_top.png)"
        required: false
        type: string
      size:
        description: "Sheet size — a 4x3 grid wants the tall one"
        required: false
        type: choice
        options:
          - "1024x1536"
          - "1024x1024"
          - "1536x1024"
        default: "1024x1536"
      quality:
        description: "Render quality — cost rises steeply: low < medium < high"
        required: false
        type: choice
        options:
          - "low"
          - "medium"
          - "high"
        default: "high"
      force:
        description: "Regenerate even if the sheet already exists"
        required: false
        type: boolean
        default: false
      branch:
        description: "Branch to check out and commit the frames to. Defaults to main; point it at a review branch to LOOK at a character before it ships."
        required: false
        type: string
        default: "main"

permissions:
  contents: write

jobs:
  walksheet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # NOT ALWAYS main. Art is the one thing in this repo you cannot review
      # from a diff — a sheet has to be looked at, and by the time it is on
      # main it has shipped. Generating onto a branch means a character can be
      # seen, rejected and regenerated without ever reaching the live site.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: ./.github/actions/validate-game-input
        with:
          game: ${{ inputs.game }}

      # MODEL COMES FROM THE SAME PLACE AS EVERY OTHER GENERATOR, EVEN THOUGH
      # THIS ENDPOINT IS DIFFERENT. /images/edits (multipart, reference-image
      # input) is not the JSON call imagegen.py's build_request() validates —
      # unifying the transport itself is real follow-up work, not done here,
      # and not worth guessing at with no key in this environment to test a
      # multipart call against. But the model string being retyped in a FOURTH
      # place is exactly the divergence that put two different generators'
      # art in one character sheet tonight, so at minimum that one value comes
      # from profiles.py rather than being hardcoded again.
      - name: Resolve model
        id: model
        run: |
          echo "model=$(python3 -c 'import sys; sys.path.insert(0,".github/art"); import profiles; print(profiles.MODEL)')" >> "$GITHUB_OUTPUT"

      - name: Build the canonical walk-sheet prompt
        id: prompt
        env:
          CHARACTER: ${{ inputs.description }}
        run: |
          set -euo pipefail
          # Single source of truth for the recipe — never retype it inline.
          prompt=$(python3 - <<'PY'
          import os
          tpl = open('.github/art/walksheet_prompt.txt').read().strip()
          print(tpl.replace('{CHARACTER}', os.environ['CHARACTER']))
          PY
          )
          {
            echo "text<<PROMPT_EOF"
            echo "$prompt"
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate the sheet
        id: gen
        timeout-minutes: 12
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROMPT: ${{ steps.prompt.outputs.text }}
          GAME: ${{ inputs.game }}
          CHAR: ${{ inputs.character_id }}
          REFERENCES: ${{ inputs.references }}
          SIZE: ${{ inputs.size }}
          QUALITY: ${{ inputs.quality }}
          FORCE: ${{ inputs.force }}
        run: |
          set -uo pipefail
          SHEET="games/$GAME/art/${CHAR}_walksheet.png"
          if [ -s "$SHEET" ] && [ "$FORCE" != "true" ]; then
            echo "::notice::$SHEET already exists — skipping (re-run with force=true)."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$(dirname "$SHEET")"

          # TWO ENDPOINTS, TWO CONTENT TYPES, AND THEY ARE NOT INTERCHANGEABLE.
          # This used to build multipart -F arguments unconditionally and post
          # them to whichever URL it picked — so the NO-REFERENCE path could
          # never work at all: /v1/images/generations is JSON-only and answered
          # every single call with
          #   HTTP 400 Unsupported content type: 'multipart/form-data'.
          # It went unnoticed because every character to date was generated
          # WITH a reference image, which takes the /edits branch, where
          # multipart is correct. The first character asked for from a plain
          # description failed instantly and looked like an API problem.
          # So: references -> multipart to /images/edits. None -> JSON to
          # /images/generations, body built by jq so the prompt cannot break
          # the quoting.
          ARGS=()
          URL=https://api.openai.com/v1/images/generations
          if [ -n "$REFERENCES" ]; then
            URL=https://api.openai.com/v1/images/edits
            ARGS=(-F "model=${{ steps.model.outputs.model }}" -F "prompt=${PROMPT}" -F "size=${SIZE}" -F "quality=${QUALITY}")
            IFS=',' read -ra REFS <<< "$REFERENCES"
            for ref in "${REFS[@]}"; do
              r=$(echo "$ref" | xargs)
              [ -z "$r" ] && continue
              [ -f "$r" ] || { echo "::error::Reference not found: $r"; exit 1; }
              ARGS+=(-F "image[]=@${r}")
            done
          else
            body_json=$(jq -n \
              --arg model "${{ steps.model.outputs.model }}" \
              --arg prompt "$PROMPT" \
              --arg size "$SIZE" \
              --arg quality "$QUALITY" \
              '{model: $model, prompt: $prompt, size: $size, quality: $quality, n: 1}')
            ARGS=(-H "Content-Type: application/json" -d "$body_json")
          fi

          # PRE-FLIGHT: the endpoint and the encoding have to agree, and that is
          # decidable here for free. The bug this replaces cost a whole run to
          # discover and read like an outage; this costs one string comparison
          # and names the fix. Checked BEFORE the key is ever used, so a
          # mismatch fails in under a second and bills nothing.
          # Read the encoding off the ARGS THEMSELVES rather than trusting a
          # variable set beside them — the point is to catch the branch above
          # being edited into disagreeing with the endpoint, which a
          # self-declared value cannot do.
          has_json=no; has_form=no
          for a in "${ARGS[@]}"; do
            case "$a" in *"application/json"*) has_json=yes ;; esac
            [ "$a" = "-F" ] && has_form=yes
          done
          encoding="unknown"
          [ "$has_json" = yes ] && [ "$has_form" = no ] && encoding="json"
          [ "$has_form" = yes ] && [ "$has_json" = no ] && encoding="multipart"
          case "$URL:$encoding" in
            *"/images/generations:json"|*"/images/edits:multipart") : ;;
            *":unknown")
              echo "::error::Request is neither cleanly JSON nor cleanly multipart (json=$has_json form=$has_form) — one branch of the endpoint choice above has been edited into building both, or neither."
              exit 1 ;;
            *"/images/generations:multipart")
              echo "::error::Transport mismatch: sending multipart/form-data to /v1/images/generations, which is JSON-only — this ALWAYS returns HTTP 400 and never generates anything. Fix: build the request with jq into -d, as the no-references branch above does. (URL=$URL encoding=$encoding references='${REFERENCES}')"
              exit 1 ;;
            *"/images/edits:json")
              echo "::error::Transport mismatch: sending JSON to /v1/images/edits, which needs multipart/form-data to carry the reference images. Fix: build -F arguments, as the references branch above does. (URL=$URL encoding=$encoding references='${REFERENCES}')"
              exit 1 ;;
            *) echo "::error::Unknown endpoint '$URL' — only /v1/images/generations and /v1/images/edits are supported here."; exit 1 ;;
          esac
          echo "Requesting $URL as $encoding (references: ${REFERENCES:-none})"

          ok=""
          for attempt in 1 2 3 4 5; do
            resp=$(curl -sS -w '\n%{http_code}' "$URL" \
              -H "Authorization: Bearer $OPENAI_API_KEY" "${ARGS[@]}" || true)
            code=$(printf '%s' "$resp" | tail -n1)
            body=$(printf '%s' "$resp" | sed '$d')
            [ "$code" = "200" ] && { ok=1; break; }
            err=$(printf '%s' "$body" | jq -r '.error.message // empty' 2>/dev/null)
            if [ "$code" = "429" ] || [ "$code" = "000" ] || [ "${code#5}" != "$code" ]; then
              wait=$((attempt * 15 + RANDOM % 8))
              echo "Transient (HTTP $code, attempt $attempt): ${err:-no body} — retrying in ${wait}s"
              sleep "$wait"; continue
            fi
            # A 400 here is nearly always OUR request being malformed, not an
            # outage — say so, and say where to look, so the next person does
            # not read it as "the API is down" and re-run it five times.
            if [ "$code" = "400" ]; then
              echo "::error::OpenAI REJECTED the request (HTTP 400) — the request this workflow built is wrong, retrying will not help. Message: ${err:-unknown}. Endpoint $URL, encoding $encoding, references '${REFERENCES:-none}', size $SIZE, quality $QUALITY. Check those against what that endpoint accepts; if it mentions content type, the endpoint/encoding pairing in the 'Generate the sheet' step is the thing to fix."
              exit 1
            fi
            echo "::error::OpenAI API error (HTTP $code): ${err:-unknown} (endpoint $URL, encoding $encoding)"; exit 1
          done
          [ -n "$ok" ] || { echo "::error::Still failing after retries"; exit 1; }

          printf '%s' "$body" | jq -r '.data[0].b64_json' | base64 -d > "$SHEET"
          [ -s "$SHEET" ] || { echo "::error::Sheet is empty — generation failed"; exit 1; }
          echo "sheet=$SHEET" >> "$GITHUB_OUTPUT"

      - name: Slice the grid into frames
        if: steps.gen.outputs.skipped != 'true'
        timeout-minutes: 6
        env:
          GAME: ${{ inputs.game }}
          CHAR: ${{ inputs.character_id }}
          SHEET: ${{ steps.gen.outputs.sheet }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pillow numpy

          # CLEAR THE OLD FRAMES FIRST. The completeness check below asks "is
          # there a file here", and a file left over from a PREVIOUS
          # generation answers yes — so a slice that produced nothing for a
          # row passed, the stale art got committed unchanged, and the run
          # reported success. That is how May kept her old antlered,
          # decapitated walk cycle through a regeneration that had already
          # drawn her correctly, and how Chuck kept a bald orange back view
          # after his sheet only yielded two rows. Deleting first means the
          # check can only ever be satisfied by art this run actually cut.
          rm -f "games/$GAME/art/${CHAR}"_{down,left,up}_{0,1,2}.png

          python3 .github/art/slice_walksheet.py "$SHEET" "games/$GAME/art" "$CHAR"

          missing=""
          for dir in down left up; do
            for n in 0 1 2; do
              f="games/$GAME/art/${CHAR}_${dir}_${n}.png"
              [ -s "$f" ] || missing="$missing $f"
            done
          done
          if [ -n "$missing" ]; then
            echo "::error::slicer did not produce the full 3x3 set — missing:$missing"
            exit 1
          fi

          # Present is not the same as usable. A sheet whose gridlines were
          # misread cuts nine real files that happen to be slivers of coat, so
          # run the same checker the build gate runs — it fails a set with a
          # missing, duplicated or CROPPED frame.
          python3 .github/art/verify_sheet.py frames "games/$GAME/art" "$CHAR" 

      - name: Commit the frames
        if: steps.gen.outputs.skipped != 'true'
        env:
          GAME: ${{ inputs.game }}
          CHAR: ${{ inputs.character_id }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "games/$GAME/art/${CHAR}_"*.png
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Walk sheet for ${CHAR} (${GAME}): 3-frame RPG-Maker cycle, down/left/up"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then exit 0; fi
            echo "push race, retrying ($i)…"; sleep $((RANDOM % 6 + 2))
          done
          echo "::error::could not push after retries"; exit 1
